    patterns: ['\bHUSSEIN\b', '\bHussein\b', '\bObama\b', '\bOBAMA\b', '\bBarack\b', '(?<!/)(?<!the )(?<!you, )(?<!service, )\bBO\b(?!/)(?!, Bakers)']
    gdelt: ["BARACK OBAMA", "OBAMA"]


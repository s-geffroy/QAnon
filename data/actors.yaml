# Dictionnaire cure des acteurs cites dans les drops Q.
#
# Une entree : id (slug unique), name, category, role_fr, role_en, patterns.
# Optionnel : gdelt (noms Actor1Name/Actor2Name exacts, en majuscules, vus dans
# des fichiers d'evenements GDELT 1.0 echantillons du 2018-10-01 et du
# 2019-04-01), iso3 + fips pour les pays (GDELT ActionGeo_CountryCode = FIPS 10-4).
#
# Categories : person | country | institution | organization | media |
# platform | group.
#
# Les motifs sont des regex Python appliquees SENSIBLES A LA CASSE au texte
# des drops. Ils visent les mentions dans la prose : les domaines et les
# comptes Twitter cites dans des URL ne sont volontairement pas comptes
# (twitter.com/HillaryClinton, foxnews.com...) -- c'est une autre analyse.
#
# Choix de desambiguisation (verifies sur le contexte des drops) :
# - BO = Barack Obama, sauf "/BO/" (Board Owner de 8chan) ; HUSSEIN = Obama.
# - AS = Adam Schiff seulement hors d'un texte en capitales ("AS" anglais).
# - SA = Arabie saoudite ; NK = Coree du Nord ; U1 = Uranium One.
# - JC = Comey, LL = Lynch, RR = Rosenstein, PS = Strzok, LP = Lisa Page,
#   AM = McCabe, CS = Schumer, NP = Pelosi, MW = Maxine Waters,
#   VJ = Valerie Jarrett, JK = John Kerry, MZ = Zuckerberg, GS = Soros,
#   JA = Assange, WL = WikiLeaks, CF = Clinton Foundation,
#   MB = Muslim Brotherhood, PP = Planned Parenthood, TG = Trey Gowdy,
#   KC = Kevin Clinesmith, SH = Sean Hannity, SY = Sally Yates, HA = Huma
#   Abedin, AW = Anthony Weiner, JP = John Podesta, NG = National Guard.
# - "Clowns" / "C_A" / "Clowns In America" = CIA ; "No Such Agency" = NSA ;
#   "No Name" / "we don't say his name" / "John M" = John McCain.
# - Exclus car ambigus : SC (Supreme Court ou Special Counsel), ES (Eric
#   Schmidt ou Edward Snowden, Q le dit lui-meme), JB (Brennan, Jim Baker ou
#   Jeff Bezos), CA (Californie, pas le Canada), BP (Priestap ou Border
#   Patrol), RT, SR, CM, RC.
# - Personnes privees exclues (Seth Rich, administrateurs de 8chan, freres
#   Awan, victimes et anonymes des listes d'inculpations).
# - "Clinton" seul -> clinton_family (sauf precede de Hillary/Bill/President,
#   ou suivi de Foundation) ; Hillary et Bill ont leurs propres entrees.
# - Les pays cites uniquement dans la liste des banques centrales (drops
#   135-138) ne sont pas repris, sauf ceux qui comptent pour GDELT
#   (Turquie, Emirats, Egypte).

actors:

  # ---------------------------------------------------------------- personnes
  - id: trump
    name: "Donald Trump"
    category: person
    role_fr: "45e président des États-Unis (2017-2021)"
    role_en: "45th President of the United States (2017-2021)"
    patterns: ['\bPOTUS\b', '\bTrump\b(?! Jr)', '\bTRUMP\b(?! JR)', '\bDJT\b']

  - id: pence
    name: "Mike Pence"
    category: person
    role_fr: "Vice-président des États-Unis (2017-2021)"

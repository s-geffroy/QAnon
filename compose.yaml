# Un worker : du travail de fond, aucune surface HTTP. Donc pas de labels
# Traefik, pas de reseau edge, et 'exposure: none' dans app.yaml -- appctl
# refuse l'un sans l'autre.
services:
  worker:
    build:
      context: ./src
    restart: unless-stopped
    networks:
      - internal
    environment:
      APP_NAME: qanon
      TZ: Europe/Paris
      WORKER_INTERVAL: "60"
      # Budget d'un cycle : chaque etape s'arrete a un lot quand il est epuise.
      PIPELINE_CYCLE_BUDGET: "45"
      # Annotation du corpus : modele retenu apres evaluation, plafond de depense.
      LLM_MODEL: gpt-5.6-luna
      OPENAI_BUDGET_USD: "15"
      # Publication sur GitHub Pages suspendue tant que vaut "1" (le temps d'une relecture) ;
      # levee le 16/10/2026 a la demande du proprietaire.
      PUBLISH_HOLD: "0"
    volumes:
      - state:/state
    # Lus dans /run/secrets/<nom> par qanon/secrets.py. Fichiers en 0444 sur
    # l'hote : le worker tourne en utilisateur non privilegie.
    secrets:
      - openai_api_key
      # Jeton GitHub limite au depot (Contents: read/write) : publication automatique de gh-pages.
      - github_token
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 128
    healthcheck:
      # Le worker touche /tmp/heartbeat a chaque tour : le conteneur est sain
      # tant que ce fichier est recent. Le seuil doit rester superieur a deux
      # fois WORKER_INTERVAL. 'Sain' veut dire "la boucle tourne", pas "le
      # travail reussit" -- ca, ce sont les logs qui le disent.
      # Les '$$' sont des '$' : Docker Compose interprete un '$' seul.
      test: ["CMD", "sh", "-c", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Le worker s'arrete a la fin du cycle en cours. Un cycle est borne par
    # PIPELINE_CYCLE_BUDGET (45 s) plus la fin du lot en cours : 90 s de marge.
    stop_grace_period: 90s

secrets:
  openai_api_key:
    file: /etc/app-secrets/qanon/openai_api_key
  github_token:
    file: /etc/app-secrets/qanon/github_token

networks:
  internal:
    name: qanon-internal
    external: true

volumes:
  state:
    name: qanon_state

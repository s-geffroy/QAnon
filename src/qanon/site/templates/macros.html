{% macro chart(id, spec, title, note=None) %}
<figure class="chart">
  <figcaption><h3>{{ title }}</h3>{% if note %}<p class="note">{{ note }}</p>{% endif %}</figcaption>
  <div class="vis-wrap"><div class="vis" id="vis-{{ id }}"></div></div>
  <script type="application/json" data-chart="vis-{{ id }}">{{ spec | tojson_compact }}</script>
  {{ caller() if caller else "" }}
</figure>
{% endmacro %}
{% macro pending(t) %}<p class="pending">{{ t.pending }}</p>{% endmacro %}

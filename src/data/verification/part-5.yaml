    horizon: "2021-06-10"
    trivial: false
    explanation_fr: "Question rhétorique ; en juin 2020, l'extension du vote par correspondance était déjà au cœur du débat public. Pas de prédiction."
    explanation_en: "A rhetorical question; by June 2020, expanding vote-by-mail was already at the centre of public debate. Not a prediction."
    sources: []
  - key: "4489-0"
    verdict: not_a_prediction

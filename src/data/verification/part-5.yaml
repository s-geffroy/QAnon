    explanation_fr: "En juin 2020, la hausse du chômage (14,7 % en avril, 13,3 % en mai) était déjà publiée ; Q décrivait une situation existante."
    explanation_en: "By June 2020 the rise in unemployment (14.7% in April, 13.3% in May) had already been published; Q described an existing situation."

    trivial: false
    explanation_fr: "Affirmation sur l'intention prêtée à l'enquête Mueller vis-à-vis des élections de mi-mandat de 2018, déjà passées au moment du message. Pas de prédiction."
    explanation_en: "A claim about the purpose attributed to the Mueller investigation regarding the 2018 midterms, already past when Q posted. Not a prediction."

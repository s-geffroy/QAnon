    trivial: false
    explanation_fr: "Q décrivait les effets attribués aux confinements alors en vigueur ; la contraction économique du printemps 2020 était déjà en cours et connue. Pas de prédiction."
    explanation_en: "Q described effects attributed to lockdowns already in force; the spring 2020 economic contraction was already under way and known. Not a prediction."

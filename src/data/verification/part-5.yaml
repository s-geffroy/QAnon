  - key: "3993-0"
    verdict: unverifiable
    horizon: "2021-04-28"
    trivial: false
    explanation_fr: "Les documents du « Gang of Eight » (briefings classifiés aux dirigeants du Congrès) ne sont pas définis et n'ont pas été déclassifiés en tant que tels ; seules les transcriptions d'auditions de la commission du renseignement de la Chambre ont été publiées le 7 mai 2020. Le « rôle critique » d'Adam Schiff n'est pas vérifiable."
    explanation_en: "The 'Gang of Eight' material (classified briefings to congressional leaders) is undefined and was not declassified as such; only the House Intelligence Committee's interview transcripts were released on 7 May 2020. Adam Schiff's 'critical' role is not checkable."
    sources: []

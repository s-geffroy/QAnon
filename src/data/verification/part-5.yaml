    trivial: false
    explanation_fr: "Q accusait des gouverneurs démocrates à propos de mesures déjà prises (consignes sur les maisons de retraite au printemps 2020) ; il s'agit d'une accusation sur le présent, non d'une prédiction."
    explanation_en: "Q accused Democratic governors over measures already taken (nursing-home guidance in spring 2020); this is an accusation about the present, not a prediction."
    sources: []
  - key: "4489-5"
    verdict: not_a_prediction
    horizon: "2021-06-21"
    trivial: false
    explanation_fr: "Joe Biden faisait déjà campagne principalement depuis son domicile depuis mars 2020 ; Q prêtait une intention à une situation existante."
    explanation_en: "Joe Biden had already been campaigning mostly from home since March 2020; Q attributed an intent to an existing situation."
    sources: []
  - key: "4489-6"
    verdict: fulfilled
    horizon: "2021-06-21"
    trivial: true
    explanation_fr: "Pour l'élection de novembre 2020, la Californie, le Nevada, le New Jersey, le Vermont et Washington D.C. ont envoyé un bulletin à tous les électeurs inscrits ; la Californie l'avait déjà annoncé en mai 2020. Cela n'a pas donné lieu à une fraude significative."
    explanation_en: "For the November 2020 election, California, Nevada, New Jersey, Vermont and Washington D.C. mailed a ballot to every registered voter; California had already announced this in May 2020. No significant fraud resulted."
    sources: ["https://www.npr.org/2020/09/14/909338758/map-mail-in-voting-rules-by-state", "https://www.snopes.com/fact-check/millions-mail-in-ballots/"]
  - key: "4489-8"
    verdict: unverifiable
    horizon: "2021-06-21"
    trivial: false
    explanation_fr: "Q prêtait une coordination secrète aux maires et gouverneurs autour des manifestations ; ce plan supposé n'est pas vérifiable (la « zone autonome » de Seattle existait déjà depuis le 8 juin 2020)."
    explanation_en: "Q alleged secret coordination by mayors and governors around the protests; this supposed plan is not checkable (Seattle's 'autonomous zone' had existed since 8 June 2020)."
    sources: []
  - key: "4489-9"

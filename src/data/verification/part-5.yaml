    explanation_en: "Q attributed to opponents a plan to bait Trump into using the military; the alleged intent is not checkable. Trump did not invoke the Insurrection Act in 2020."
    sources: []
  - key: "4489-11"
    verdict: partial
    horizon: "2021-06-21"
    trivial: false
    explanation_fr: "Une deuxième vague a bien conduit à de nouvelles restrictions (fermetures en Californie en juillet 2020, ordre régional de décembre 2020), décidées par des gouverneurs des deux partis ; la motivation électorale que Q leur prêtait n'est pas étayée."
    explanation_en: "A second wave did lead to new restrictions (California closures in July 2020, regional order in December 2020), imposed by governors of both parties; the electoral motive Q attributed to them is unsupported."
    sources: ["https://www.cnbc.com/2020/12/03/california-to-impose-regional-stay-at-home-order-to-ease-covid-hospitalizations-governor-says.html", "https://en.wikipedia.org/wiki/COVID-19_pandemic_in_the_United_States"]

  - key: "4220-0"
    verdict: not_a_prediction
    horizon: "2021-05-12"
    trivial: false
    explanation_fr: "Q citait un article où Kevin McCarthy jugeait que le plan de 3 000 milliards ne deviendrait jamais loi ; la prévision est celle de McCarthy. De fait, le HEROES Act, adopté par la Chambre le 15 mai 2020, n'a jamais été examiné par le Sénat."
    explanation_en: "Q quoted an article in which Kevin McCarthy said the $3 trillion bill would never become law; the forecast is McCarthy's. In fact the HEROES Act, passed by the House on 15 May 2020, was never taken up by the Senate."
    sources: []
  - key: "4294-0"
    verdict: not_fulfilled
    horizon: "2020-11-03"
    trivial: false
    explanation_fr: "Q annonçait la fin des consignes de confinement et de la promotion du vote par correspondance au lendemain de l'élection. Les restrictions sanitaires ont continué après le 3 novembre 2020 et ont même été renforcées lors de la vague hivernale (ordre régional de confinement en Californie le 3 décembre 2020)."
    explanation_en: "Q announced that stay-at-home and vote-by-mail 'fear' tactics would end the day after the election. Public-health restrictions continued after 3 November 2020 and were even tightened during the winter wave (California's regional stay-at-home order of 3 December 2020)."
    sources: ["https://www.cnbc.com/2020/12/03/california-to-impose-regional-stay-at-home-order-to-ease-covid-hospitalizations-governor-says.html", "https://en.wikipedia.org/wiki/COVID-19_pandemic_in_the_United_States"]
  - key: "4381-0"
    verdict: unverifiable
    horizon: "2020-11-03"
    trivial: false
    explanation_fr: "Jugement sur l'attitude d'une chaîne (« incitera à la division ») sans critère vérifiable."

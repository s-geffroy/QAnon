    sources: []
  - key: "4414-0"
    verdict: fulfilled
    horizon: "2021-06-04"
    trivial: false
    explanation_fr: "Dans une liste présentée comme des signaux d'alerte, Q mentionnait la « suppression du compte Twitter de POTUS ». Twitter a suspendu définitivement le compte personnel de Donald Trump le 8 janvier 2021, invoquant un risque d'incitation à la violence après l'assaut du Capitole, et non dans le scénario de coup d'État décrit par Q."
    explanation_en: "In a list framed as warning signs, Q mentioned 'POTUS twitter removal'. Twitter permanently suspended Donald Trump's personal account on 8 January 2021, citing a risk of incitement after the Capitol attack, not within the coup scenario Q described."
    sources: ["https://en.wikipedia.org/wiki/Social_media_use_by_Donald_Trump", "https://www.revolt.tv/news/2021/1/12/22226989/twitter-suspends-qanon-accounts-capitol-riot"]
  - key: "4414-1"
    verdict: not_fulfilled
    horizon: "2021-06-04"
    trivial: false
    explanation_fr: "Aucune coupure générale des communications sur le territoire continental des États-Unis n'a eu lieu dans l'année suivant le message."
    explanation_en: "No general communications blackout across the continental United States occurred in the year after the post."
    sources: ["https://en.wikipedia.org/wiki/COVID-19_pandemic_in_the_United_States", "https://en.wikipedia.org/wiki/QAnon"]
  - key: "4414-2"
    verdict: unverifiable
    horizon: "2021-06-04"
    trivial: false
    explanation_fr: "« CLAS movement PELOSI or PENCE » renvoie à un déplacement classifié non défini ; rien de vérifiable."
    explanation_en: "'CLAS movement PELOSI or PENCE' refers to an undefined classified movement; nothing checkable."
    sources: []
  - key: "4414-3"
    verdict: fulfilled
    horizon: "2021-06-04"
    trivial: true
    explanation_fr: "Environ 1 600 militaires d'active (82e division aéroportée de Fort Bragg, police militaire de Fort Drum, base de la 10e division de montagne) avaient déjà été prépositionnés autour de Washington les 1er-2 juin 2020, avant le message ; ils n'ont pas été déployés en ville et ont commencé à repartir les 4-5 juin."
    explanation_en: "About 1,600 active-duty troops (82nd Airborne from Fort Bragg, military police from Fort Drum, home of the 10th Mountain Division) had already been staged around Washington on 1-2 June 2020, before the post; they were not deployed into the city and began leaving on 4-5 June."
    sources: ["https://www.armytimes.com/news/your-army/2020/06/04/no-those-werent-active-duty-troops-on-the-streets-of-dc-last-night-officials-say/", "https://www.ksat.com/news/politics/2020/06/05/more-active-duty-troops-leaving-dc-others-remain-on-alert/"]
  - key: "4446-0"

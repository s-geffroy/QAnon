    verdict: not_a_prediction
    horizon: "2020-05-01"
    trivial: false
    explanation_fr: "Q citait la proclamation présidentielle déjà publiée faisant du 1er mai 2020 le « Law Day » ; il ne s'agit pas d'une prédiction."
    explanation_en: "Q quoted the already-issued presidential proclamation making 1 May 2020 'Law Day'; this is not a prediction."

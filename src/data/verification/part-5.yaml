  - key: "4587-0"
    verdict: not_fulfilled
    horizon: "2020-11-04"
    trivial: false
    explanation_fr: "Q annonçait la fin du « récit » sur le Covid-19 au lendemain de l'élection. La pandémie et sa couverture se sont poursuivies : vague hivernale record et début de la vaccination en décembre 2020."
    explanation_en: "Q claimed the Covid-19 'narrative' would end the day after the election. The pandemic and its coverage continued: a record winter wave and the start of vaccination in December 2020."
    sources: ["https://en.wikipedia.org/wiki/COVID-19_pandemic_in_the_United_States"]
  - key: "4587-1"
    verdict: not_fulfilled
    horizon: "2020-11-04"
    trivial: false
    explanation_fr: "Aucune cyberattaque massive n'a été signalée le 4 novembre 2020 ; le 12 novembre 2020, le conseil de coordination dirigé par la CISA a qualifié l'élection de « plus sûre de l'histoire américaine », sans aucun système compromis."
    explanation_en: "No massive cyberattack was reported on 4 November 2020; on 12 November 2020 the CISA-led coordinating council called the election 'the most secure in American history', with no system compromised."
    sources: ["https://www.nextgov.com/cybersecurity/2020/11/dhs-panel-says-2020-vote-was-most-secure-in-american-history/258296/"]
  - key: "4620-0"
    verdict: partial
    horizon: "2020-11-03"
    trivial: false
    explanation_fr: "Des restrictions sanitaires sont effectivement restées en place jusqu'au 3 novembre 2020, décidées par des gouverneurs des deux partis, mais elles ne se sont pas arrêtées après l'élection, contrairement au scénario de Q ; la coordination alléguée n'est pas étayée."
    explanation_en: "Public-health restrictions did remain in place through 3 November 2020, imposed by governors of both parties, but they did not stop after the election, contrary to Q's scenario; the alleged coordination is unsupported."
    sources: ["https://www.cnbc.com/2020/12/03/california-to-impose-regional-stay-at-home-order-to-ease-covid-hospitalizations-governor-says.html", "https://en.wikipedia.org/wiki/COVID-19_pandemic_in_the_United_States"]
  - key: "4620-1"
    verdict: not_fulfilled
    horizon: "2021-07-31"
    trivial: false
    explanation_fr: "Le report de la convention démocrate (de juillet au 17-20 août 2020) avait été annoncé dès le 2 avril 2020 ; Joe Biden y a été investi et est resté candidat jusqu'à l'élection, sans remplacement."
    explanation_en: "The postponement of the Democratic convention (from July to 17-20 August 2020) had been announced on 2 April 2020; Joe Biden was nominated there and remained the candidate through the election, with no replacement."
    sources: ["https://en.wikipedia.org/wiki/2020_Democratic_National_Convention", "https://www.bostonglobe.com/2020/04/02/nation/democratic-national-convention-postponed-until-august/"]
  - key: "4657-0"
    verdict: not_fulfilled
    horizon: "2021-09-10"
    trivial: false
    explanation_fr: "Le deuxième débat (15 octobre 2020) a été annulé le 9 octobre par la Commission après le refus de Donald Trump d'un format virtuel, et non à l'initiative du camp Biden ; les débats du 29 septembre et du 22 octobre ont eu lieu."
    explanation_en: "The second debate (15 October 2020) was cancelled on 9 October by the Commission after Donald Trump refused a virtual format, not at the Biden campaign's initiative; the debates of 29 September and 22 October took place."
    sources: ["https://en.wikipedia.org/wiki/2020_United_States_presidential_debates", "https://www.fox35orlando.com/news/2nd-presidential-debate-officially-scrapped-after-trump-refuses-virtual-showdown"]
  - key: "4657-1"
    verdict: not_fulfilled

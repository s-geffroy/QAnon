items:
  - key: "3691-0"
    verdict: not_fulfilled
    horizon: "2020-12-31"
    trivial: false
    explanation_fr: "Q annonçait le « retour » d'Edward Snowden aux États-Unis en 2020 (#HOMECOMING2020). Snowden est resté en Russie : il y a obtenu un permis de séjour permanent en octobre 2020, puis la nationalité russe en septembre 2022."
    explanation_en: "Q announced Edward Snowden's 'homecoming' to the United States in 2020 (#HOMECOMING2020). Snowden stayed in Russia: he was granted permanent residency there in October 2020 and Russian citizenship in September 2022."
    sources: ["https://en.wikipedia.org/wiki/Edward_Snowden", "https://www.aljazeera.com/amp/news/2022/9/26/putin-grants-russian-citizenship-us-whistleblower-edward-snowden"]
  - key: "3724-1"
    verdict: not_a_prediction
    horizon: "2020-12-18"
    trivial: false
    explanation_fr: "Q qualifiait la procédure de destitution alors en cours d'« ingérence électorale » démocrate pour 2020 ; il s'agit d'une caractérisation polémique d'un événement présent, non d'une annonce vérifiable."
    explanation_en: "Q labelled the then-ongoing impeachment as Democratic 'election interference' for 2020; this is a polemical characterisation of a present event, not a checkable forecast."
    sources: []
  - key: "3779-0"
    verdict: fulfilled
    horizon: "2021-01-21"
    trivial: true
    explanation_fr: "Le Sénat a acquitté Donald Trump des deux chefs d'accusation le 5 février 2020 (52-48 et 53-47), loin des deux tiers requis. Avec une majorité républicaine de 53 sièges, cette issue était largement anticipée au moment du message."
    explanation_en: "The Senate acquitted Donald Trump on both articles on 5 February 2020 (52-48 and 53-47), far short of the two-thirds required. With a 53-seat Republican majority, this outcome was widely expected when Q posted."
    sources: ["https://en.wikipedia.org/wiki/First_impeachment_of_Donald_Trump"]
  - key: "3788-0"
    verdict: not_fulfilled
    horizon: "2021-01-23"
    trivial: false
    explanation_fr: "Q commentait l'aveu du ministère de la Justice (rendu public le 23 janvier 2020) selon lequel au moins les deux derniers mandats FISA visant Carter Page manquaient de fondement, et annonçait la même conclusion pour « toute » la surveillance liée à Trump. Aucune conclusion de ce type n'a été rendue dans l'année : le rapport de l'inspecteur général (décembre 2019) avait jugé l'ouverture de l'enquête Crossfire Hurricane suffisamment fondée."
    explanation_en: "Q commented on the Justice Department's admission (made public on 23 January 2020) that at least the last two FISA warrants on Carter Page lacked probable cause, and claimed the same conclusion would be reached for 'all' Trump-related surveillance. No such conclusion was issued within the year: the Inspector General's December 2019 report had found the opening of Crossfire Hurricane adequately predicated."
    sources: ["https://www.lawfaremedia.org/article/fisc-declassifies-order-about-carter-page-fisa-applications", "https://en.wikipedia.org/wiki/Crossfire_Hurricane_(FBI_investigation)"]
  - key: "3841-0"
    verdict: unverifiable
    horizon: "2021-02-07"
    trivial: false
    explanation_fr: "« La vérité sera rendue publique » : formule sans objet ni échéance vérifiables."
    explanation_en: "'The truth will be made public': a formula with no checkable object or deadline."
    sources: []
  - key: "3915-0"
    verdict: not_a_prediction
    horizon: "2021-04-08"
    trivial: false
    explanation_fr: "Bernie Sanders a annoncé la suspension de sa campagne le 8 avril 2020 vers 11 h 45 (heure de l'Est) ; le message de Q, posté le même jour vers 16 h 28, est postérieur à l'annonce et ne constitue donc pas une prédiction."
    explanation_en: "Bernie Sanders announced he was suspending his campaign on 8 April 2020 around 11:45 a.m. ET; Q's post, made the same day around 4:28 p.m., came after the announcement and is therefore not a prediction."
    sources: ["https://en.wikipedia.org/wiki/Bernie_Sanders_2020_presidential_campaign", "https://qalerts.app/?n=3915"]
  - key: "3932-2"
    verdict: partial
    horizon: "2021-04-10"
    trivial: false
    explanation_fr: "Le 30 juin 2020, le représentant Steve Cohen a déposé une résolution (H.Res. 1032, 35 coauteurs) demandant une enquête en vue de destituer William Barr ; mais la direction démocrate (Pelosi, Nadler) a écarté la destitution et la Chambre n'a jamais voté. Barr a démissionné de lui-même en décembre 2020."
    explanation_en: "On 30 June 2020 Rep. Steve Cohen filed a resolution (H.Res. 1032, 35 co-sponsors) calling for an impeachment inquiry into William Barr, but the Democratic leadership (Pelosi, Nadler) ruled impeachment out and the House never voted. Barr resigned of his own accord in December 2020."
    sources: ["https://foxnews.com/politics/ag-barr-targeted-by-house-dems-impeachment-resolution.amp", "https://www.aljazeera.com/news/2020/6/21/us-impeaching-barr-a-waste-of-time-says-top-democrat", "https://en.wikipedia.org/wiki/William_Barr"]
  - key: "3932-3"
    verdict: partial
    horizon: "2021-04-10"
    trivial: false
    explanation_fr: "La commission judiciaire de la Chambre a tenu le 24 juin 2020 une audience sur la « politisation » du ministère de la Justice sous Barr (affaires Stone et Flynn) et a entendu Barr le 28 juillet 2020 ; aucune enquête parlementaire visant spécifiquement l'enquête Durham n'a toutefois été ouverte dans l'année."
    explanation_en: "The House Judiciary Committee held a hearing on 24 June 2020 on the alleged 'politicisation' of the Justice Department under Barr (Stone and Flynn cases) and questioned Barr on 28 July 2020; no congressional investigation specifically targeting the Durham inquiry was opened within the year."
    sources: ["https://www.pbs.org/newshour/politics/democrats-say-justice-department-whistleblowers-to-testify", "https://en.wikipedia.org/wiki/Durham_special_counsel_investigation"]
  - key: "3957-0"
    verdict: partial
    horizon: "2021-04-14"
    trivial: false
    explanation_fr: "Q annonçait une « suppression [blackout] » des comptes pro-Trump liée à l'élection. Twitter a supprimé le compte personnel de Donald Trump le 8 janvier 2021 et plus de 70 000 comptes liés à QAnon dans les jours suivants, au motif de risques d'incitation à la violence après l'assaut du Capitole ; il ne s'agissait pas d'un « blackout » général des comptes favorables au président."
    explanation_en: "Q announced a 'removal [blackout]' of pro-Trump accounts tied to the election. Twitter suspended Donald Trump's personal account on 8 January 2021 and more than 70,000 QAnon-linked accounts in the following days, citing incitement risks after the Capitol attack; this was not a general blackout of pro-president accounts."
    sources: ["https://www.revolt.tv/news/2021/1/12/22226989/twitter-suspends-qanon-accounts-capitol-riot", "https://en.wikipedia.org/wiki/Social_media_use_by_Donald_Trump"]
  - key: "3970-0"
    verdict: unverifiable
    horizon: "2020-12-31"
    trivial: false
    explanation_fr: "« L'éveil mondial » lié à l'élection de 2020 n'a pas d'objet mesurable."
    explanation_en: "The 'World Awakening' tied to the 2020 election has no measurable object."
    sources: []
  - key: "3992-0"
    verdict: not_a_prediction
    horizon: "2021-04-28"
    trivial: false
    explanation_fr: "Q affirmait ce à quoi l'enquête Mueller (close en mars 2019) aurait été « destinée » ; il s'agit d'une interprétation du passé, non d'une prédiction."
    explanation_en: "Q asserted what the Mueller investigation (closed in March 2019) was supposedly 'designed' for; this is an interpretation of the past, not a prediction."
    sources: []
  - key: "3992-2"
    verdict: not_a_prediction
    horizon: "2021-04-28"
    trivial: false
    explanation_fr: "Affirmation sur l'intention prêtée à l'enquête Mueller, close en 2019 ; la première procédure de destitution avait déjà eu lieu. Pas de prédiction."
    explanation_en: "A claim about the purpose attributed to the Mueller investigation, which closed in 2019; the first impeachment had already taken place. Not a prediction."
    sources: []
  - key: "3992-3"
    verdict: not_a_prediction

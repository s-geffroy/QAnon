  "explanation_fr": "Q présentait un faux communiqué du DHS annonçant un rapport final sur des « millions de bulletins illégaux » dès mars 2018. Aucun rapport de ce type n'a été publié ; la commission présidentielle sur l'intégrité électorale a été dissoute le 3 janvier 2018 sans avoir établi de fraude massive."
  "explanation_en": "Q presented a fake DHS statement announcing a final report on 'several million illegal ballots' as early as March 2018. No such report was ever released; the Presidential Advisory Commission on Election Integrity had been disbanded on January 3, 2018 without establishing any mass fraud."
  "sources":
  - "https://en.wikipedia.org/wiki/Presidential_Advisory_Commission_on_Election_Integrity"

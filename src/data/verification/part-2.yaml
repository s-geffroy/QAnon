  "explanation_fr": "Trump souhaitait publiquement un défilé militaire depuis septembre 2017 ; le Pentagone a fixé la date au 11 novembre 2018 dans un mémo rendu public le 9 mars, trois jours après le message de Q. Le défilé a été annulé le 16-17 août 2018 en raison de son coût (92 millions de dollars) ; Trump a assisté le 11 novembre aux commémorations de l'Armistice à Paris."
  "explanation_en": "Trump had publicly wanted a military parade since September 2017; the Pentagon set the date to November 11, 2018 in a memo made public on March 9, three days after Q's post. The parade was cancelled on August 16-17, 2018 over its cost ($92 million); on November 11 Trump attended the Armistice centenary in Paris."

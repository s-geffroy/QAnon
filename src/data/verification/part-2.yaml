  "explanation_fr": "Q annonçait que le forum serait discuté « sur toutes les plateformes » dans les mois suivants. De fait, QAnon s'est largement diffusé sur YouTube, Facebook et Twitter en 2018 et a accédé à une forte couverture médiatique après le meeting de Trump à Tampa le 31 juillet 2018 ; c'est une annonce en partie autoréalisatrice."
  "explanation_en": "Q claimed the board would be discussed 'across all platforms' in the coming months. QAnon did spread widely on YouTube, Facebook and Twitter in 2018 and drew heavy mainstream coverage after Trump's Tampa rally on July 31, 2018; the claim was partly self-fulfilling."
  "sources":
  - "https://fortune.com/2018/08/01/qanon-conspiracy-trump-tampa-rally"
  - "https://en.wikipedia.org/wiki/QAnon"

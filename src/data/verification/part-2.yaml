- "key": "570-4"
  "verdict": "partial"
  "horizon": "2019-01-21"
  "trivial": false
  "explanation_fr": "Le mémo Nunes a été publié le 2 février 2018 ; il affirmait que la cour FISA n'avait pas été informée du financement politique du dossier Steele utilisé contre Carter Page. Il n'établissait pas la fourniture « sciemment » de fausses informations, et le FBI comme la minorité démocrate ont contesté sa présentation ; les erreurs du dossier FISA n'ont été documentées par l'inspecteur général qu'en décembre 2019."
  "explanation_en": "The Nunes memo was released on February 2, 2018; it asserted that the FISA court had not been told about the political funding of the Steele dossier used against Carter Page. It did not establish that 'knowingly false' intelligence was provided, and the FBI and the Democratic minority disputed its framing; errors in the FISA applications were documented by the inspector general only in December 2019."
  "sources":
  - "https://en.wikipedia.org/wiki/Nunes_memo"
  - "https://www.axios.com/2018/02/02/read-nunes-memo-fbi-doj-fisa-mueller"

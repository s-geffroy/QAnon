  "explanation_fr": "Le mardi 10 avril 2018, au forum de Boao, Xi Jinping a annoncé que la Chine réduirait « considérablement » cette année ses droits de douane sur les automobiles importées ; la baisse de 25 % à 15 % a été annoncée le 22 mai et appliquée le 1er juillet 2018. Le message de Q, publié le même jour, coïncide avec un discours attendu dans un contexte de tensions commerciales, et sa référence à Chongqing ne correspond pas."
  "explanation_en": "On Tuesday, April 10, 2018, at the Boao Forum, Xi Jinping announced that China would 'considerably' cut import tariffs on cars that year; the cut from 25% to 15% was announced on May 22 and took effect on July 1, 2018. Q's post, published the same day, coincides with a speech that was anticipated amid trade tensions, and its Chongqing reference does not match."
  "sources":
  - "https://www.wamc.org/2018-04-10/xi-says-china-ready-to-lower-import-tariffs-and-trade-barriers"

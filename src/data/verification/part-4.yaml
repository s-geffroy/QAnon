items:
- key: 2397-1
  verdict: not_a_prediction
  horizon: '2018-11-06'
  trivial: false
  explanation_fr: 'Le message attribue à l''enquête Mueller l''objectif supposé de « gagner du temps » jusqu''aux élections de mi-mandat pour mettre fin aux enquêtes parlementaires : c''est une accusation sur une intention, non l''annonce d''un événement vérifiable.'
  explanation_en: 'The post ascribes to the Mueller investigation an alleged aim of ''stalling'' until the midterms to end congressional investigations: this is a claim about intent, not the announcement of a checkable event.'
  sources: []
- key: 2416-0
  verdict: not_fulfilled
  horizon: '2019-11-04'
  trivial: false
  explanation_fr: Q annonçait une action coordonnée d'ANTIFA ou d'autres groupes sur plus de 29 bureaux de vote clés lors des élections du 6 novembre 2018. Les comptes rendus du jour du scrutin ont fait état de pannes de machines, de longues files d'attente et d'incidents isolés, mais d'aucune opération coordonnée de ce type.
  explanation_en: Q claimed ANTIFA or other groups would mount a coordinated push at 29+ key polling locations during the 6 November 2018 election. Election Day reporting described machine failures, long lines and isolated incidents, but no coordinated operation of this kind.
  sources:
  - https://www.pbs.org/newshour/politics/which-states-were-hit-by-voting-problems-on-election-day
  - https://www.nbcnews.com/politics/elections/midterms-2018-voters-face-malfunctioning-machines-long-lines-polls-across-n932156
- key: 2421-0
  verdict: unverifiable
  horizon: '2018-11-06'
  trivial: false
  explanation_fr: « Cibles prioritaires aujourd'hui/demain » ne désigne ni cible ni action identifiable ; le contexte évoque plutôt la diffusion de mèmes.
  explanation_en: '''High priority targets today/tomorrow'' names no identifiable target or action; the context points rather to meme campaigns.'
  sources: []
- key: 2426-0
  verdict: not_fulfilled
  horizon: '2018-11-06'
  trivial: false
  explanation_fr: Q affirmait que « la gauche n'a aucune chance » aux élections de mi-mandat. Le 6 novembre 2018, les démocrates ont gagné une quarantaine de sièges et repris la majorité à la Chambre des représentants, tandis que les républicains conservaient le Sénat.
  explanation_en: Q claimed 'the LEFT has no chance' in the midterms. On 6 November 2018 Democrats gained about forty seats and won control of the House of Representatives, while Republicans kept the Senate.
  sources:
  - https://en.wikipedia.org/wiki/2018_United_States_House_of_Representatives_elections
- key: 2444-0
  verdict: partial
  horizon: '2019-11-07'
  trivial: false
  explanation_fr: Q annonçait un transfert du contrôle parlementaire vers la commission judiciaire du Sénat. Son président Lindsey Graham a annoncé le 25 mars 2019 un examen des demandes FISA visant la campagne Trump et a auditionné l'inspecteur général Horowitz le 11 décembre 2019 ; les démocrates de la Chambre ont toutefois conservé et étendu leurs propres enquêtes.
  explanation_en: Q announced a shift of oversight to the Senate Judiciary Committee. Its chairman Lindsey Graham announced a review of the FISA applications targeting the Trump campaign on 25 March 2019 and heard Inspector General Horowitz on 11 December 2019; House Democrats nonetheless kept and expanded their own investigations.
  sources:
  - https://www.dailysignal.com/2019/03/25/graham-calls-for-new-special-counsel-to-probe-justice-department/
  - https://www.judiciary.senate.gov/press/rep/releases/chairman-graham-announces-hearing-on-doj-inspector-generals-report-on-fisa-abuse-investigation
- key: 2455-0
  verdict: fulfilled
  horizon: '2019-11-07'
  trivial: false
  explanation_fr: Q affirmait que Matthew Whitaker ne se récuserait pas de la supervision de l'enquête russe. Le 20 décembre 2018, le ministère de la Justice a indiqué qu'il ne se récuserait pas, malgré l'avis d'un responsable de la déontologie qui jugeait la question délicate.
  explanation_en: Q claimed Matthew Whitaker would not recuse himself from overseeing the Russia investigation. On 20 December 2018 the Justice Department said he would not recuse, despite an ethics official describing it as a close call.
  sources:
  - https://www.npr.org/2018/12/21/679209648/acting-attorney-general-whitaker-wont-recuse-himself-from-mueller-inquiry
  - https://fortune.com/2018/12/20/ethics-officials-say-matthew-whitaker-wont-have-to-recuse-himself-from-russia-probe
- key: 2468-0
  verdict: unverifiable
  horizon: '2018-11-18'
  trivial: false
  explanation_fr: « L'image de la Maison-Blanche doit rester stable » est une consigne vague, sans critère permettant de la vérifier.
  explanation_en: '''WH optics must remain stable'' is a vague directive with no criterion that could be checked.'
  sources: []
- key: 2501-0
  verdict: not_fulfilled
  horizon: '2019-11-25'
  trivial: false
  explanation_fr: Q affirmait que Whitaker avait approuvé la publication des documents classifiés « 1-4 » (les demandes FISA visant Carter Page). Trump avait suspendu le 21 septembre 2018 son ordre de déclassification en le confiant à l'inspecteur général ; les passages concernés n'ont pas été rendus publics dans les douze mois suivants (seule une version expurgée datait de juillet 2018).
  explanation_en: Q claimed Whitaker had approved the release of classified documents '1-4' (the Carter Page FISA applications). Trump had paused his declassification order on 21 September 2018, handing it to the inspector general; the pages in question were not made public in the following twelve months (only a redacted version had been released in July 2018).
  sources:
  - https://www.voanews.com/amp/trump-hits-pause-on-controversial-release-of-classified-russia-probe-material-/4582020.html
  - https://www.boston.com/news/politics/2018/09/21/trump-delays-russia-probe-documents-allies-voiced-concerns
- key: 2505-0
  verdict: unverifiable
  horizon: '2018-12-03'
  trivial: false
  explanation_fr: « LUNDI » n'annonce aucun événement précis ; le message ne dit pas ce qui devait se produire.
  explanation_en: '''MONDAY'' announces no specific event; the post does not say what was supposed to happen.'
  sources: []
- key: 2512-0
  verdict: not_fulfilled
  horizon: '2019-11-30'
  trivial: false
  explanation_fr: Q affirmait que Robert Mueller serait poursuivi en lien avec Uranium One. Mueller n'a jamais été inculpé ; il a remis son rapport en mars 2019 et témoigné devant le Congrès en juillet 2019.
  explanation_en: Q claimed Robert Mueller would face charges over Uranium One. Mueller was never charged; he delivered his report in March 2019 and testified before Congress in July 2019.
  sources:
  - https://en.wikipedia.org/wiki/Robert_Mueller
- key: 2522-0
  verdict: fulfilled
  horizon: '2018-12-09'
  trivial: true
  explanation_fr: George H. W. Bush est mort le 30 novembre 2018 ; ses funérailles nationales ont eu lieu le 5 décembre 2018 à Washington. Elles étaient déjà annoncées quand Q a publié, le 1er décembre.
  explanation_en: George H. W. Bush died on 30 November 2018; his state funeral was held in Washington on 5 December 2018. It had already been announced when Q posted on 1 December.
  sources:
  - https://en.wikipedia.org/wiki/State_funeral_of_George_H._W._Bush
- key: 2539-0
  verdict: unverifiable
  horizon: '2019-12-03'
  trivial: false
  explanation_fr: L'annonce d'« une des plus grandes enquêtes criminelles de l'histoire » ne désigne ni enquête, ni personne, ni date identifiable.
  explanation_en: The announcement of 'one of the largest criminal investigations in modern day history' names no identifiable investigation, person or date.
  sources: []
- key: 2552-0
  verdict: fulfilled
  horizon: '2019-12-05'
  trivial: true
  explanation_fr: 'Q reprend un article du Wall Street Journal (4 décembre 2018) : après le départ annoncé de Bill Priestap, aucun haut responsable du FBI impliqué dans les enquêtes de 2016 ne resterait au Bureau. Priestap a pris sa retraite début 2019. Annonce déjà publique, donc triviale ; le FBI présentait ce départ comme une retraite ordinaire.'
  explanation_en: 'Q relays a Wall Street Journal article (4 December 2018): after Bill Priestap''s announced departure, no senior FBI official involved in the 2016 investigations would remain. Priestap retired in early 2019. Already public, hence trivial; the FBI described it as an ordinary retirement.'
  sources:
  - https://foxnews.com/politics/top-fbi-official-bill-priestap-to-leave-government.amp
  - https://en.wikipedia.org/wiki/E._W._Priestap
- key: 2575-0
  verdict: not_fulfilled
  horizon: '2019-03-01'
  trivial: false
  explanation_fr: Q évoquait une hausse « abrupte » des taux de la Réserve fédérale à partir de mars 2019. La Fed a au contraire mis en pause ses hausses en janvier 2019, puis baissé ses taux le 31 juillet 2019, puis en septembre et octobre 2019.
  explanation_en: Q referred to a 'steep' Federal Reserve rate increase starting March 2019. Instead the Fed paused its hikes in January 2019, then cut rates on 31 July 2019 and again in September and October 2019.
  sources:
  - https://www.federalreserve.gov/newsevents/pressreleases/monetary20190731a.htm
  - https://en.wikipedia.org/wiki/History_of_Federal_Open_Market_Committee_actions
- key: 2579-0
  verdict: partial
  horizon: '2019-12-11'
  trivial: true
  explanation_fr: Trump avait lui-même menacé le 11 décembre 2018 de faire construire le mur par l'armée. Il a déclaré le 15 février 2019 une urgence nationale permettant de réaffecter des crédits du Pentagone à la construction de la barrière, mais les travaux ont été confiés à des entreprises sous contrat, non à des soldats.
  explanation_en: Trump himself had threatened on 11 December 2018 to have the military build the wall. On 15 February 2019 he declared a national emergency allowing Pentagon funds to be redirected to barrier construction, but the work went to contractors rather than troops.
  sources:
  - https://en.wikipedia.org/wiki/National_Emergency_Concerning_the_Southern_Border_of_the_United_States
- key: 2600-0
  verdict: not_fulfilled
  horizon: '2018-12-13'
  trivial: true
  explanation_fr: L'audition de la commission de contrôle de la Chambre sur la Fondation Clinton, déjà programmée, s'est tenue le 13 décembre 2018. Les deux « lanceurs d'alerte » ont refusé de remettre les documents invoqués, et aucune révélation suivie de poursuites n'en est sortie.
  explanation_en: The already-scheduled House Oversight hearing on the Clinton Foundation took place on 13 December 2018. The two 'whistleblowers' declined to hand over the documents they cited, and no revelation leading to any legal action came out of it.
  sources:
  - https://washingtonmonthly.com/2018/12/14/rep-meadows-hearing-on-the-clinton-foundation-was-a-disaster/
  - https://www.foxnews.com/politics/republicans-examine-accusations-of-pay-to-play-at-clinton-foundation-amid-plunge-in-donations
- key: 2601-0
  verdict: fulfilled
  horizon: '2019-12-12'
  trivial: false
  explanation_fr: Q saluait le départ de Rod Rosenstein. Le procureur général adjoint a remis sa démission le 29 avril 2019, effective le 11 mai 2019, après la remise du rapport Mueller ; son départ prochain avait été évoqué dans la presse dès janvier 2019.
  explanation_en: Q bid farewell to Rod Rosenstein. The deputy attorney general submitted his resignation on 29 April 2019, effective 11 May 2019, after the Mueller report was delivered; his coming departure had been reported in January 2019.
  sources:
  - https://en.wikipedia.org/wiki/Rod_Rosenstein
- key: 2610-0
  verdict: unverifiable
  horizon: '2019-01-01'
  trivial: false
  explanation_fr: Le « Non » de Q répond à une question vague (« la fraude électorale sera-t-elle exposée avant janvier ? ») sans désigner de cas. Le seul cas de fraude majeur de cette période, la fraude aux votes par correspondance dans la 9e circonscription de Caroline du Nord au profit d'un candidat républicain, est sans rapport avec les allégations de Q.
  explanation_en: Q's 'No' answers a vague question ('will voter fraud be exposed before January?') without naming any case. The one major fraud case of that period, absentee-ballot fraud in North Carolina's 9th district on behalf of a Republican candidate, is unrelated to Q's allegations.
  sources: []
- key: 2610-1
  verdict: unverifiable
  horizon: '2019-12-12'
  trivial: false
  explanation_fr: « Poussée en 2019 pour l'identification des électeurs » ne précise ni l'acteur ni la forme ; aucune initiative fédérale identifiable ne permet de trancher.
  explanation_en: '''2019 push Voter ID'' specifies neither the actor nor the form; no identifiable federal initiative allows a ruling.'
  sources: []
- key: 2620-0
  verdict: unverifiable
  horizon: '2019-12-31'
  trivial: false
  explanation_fr: « Le Sénat enquêtera sur 2019 » est cryptique ; le contexte évoque les déclarations financières de Google, sans objet d'enquête identifiable.
  explanation_en: '''Senate to investigate 2019'' is cryptic; the context mentions Google''s financial filings, with no identifiable object of investigation.'
  sources: []
- key: 2621-0
  verdict: not_fulfilled
  horizon: '2019-12-12'
  trivial: false
  explanation_fr: Q affirmait qu'une fraude électorale en Californie serait mise au jour. Aucune fraude d'ampleur n'a été établie lors des élections californiennes de 2018 ; les responsables électoraux et les vérifications des faits n'ont relevé aucun cas généralisé.
  explanation_en: Q claimed voter fraud in California would be brought to light. No large-scale fraud was established in California's 2018 elections; election officials and fact-checkers found no widespread cases.
  sources:
  - https://www.npr.org/2018/04/05/599868312/fact-check-trump-repeats-voter-fraud-claim-about-california
- key: 2681-1
  verdict: fulfilled
  horizon: '2020-02-09'
  trivial: true
  explanation_fr: William Barr, nommé en décembre 2018, a été confirmé par le Sénat et a prêté serment le 14 février 2019. Le vote de confirmation était déjà programmé quand Q a publié, le 9 février.
  explanation_en: William Barr, nominated in December 2018, was confirmed by the Senate and sworn in on 14 February 2019. The confirmation vote was already scheduled when Q posted on 9 February.
  sources:
  - https://en.wikipedia.org/wiki/William_Barr
- key: 2681-10
  verdict: partial
  horizon: '2020-02-09'
  trivial: true
  explanation_fr: 'Le sommet Trump-Kim de Hanoï, annoncé dès le 5 février 2019, a bien eu lieu les 27 et 28 février 2019, mais il s''est achevé sans accord : aucun plan de dénucléarisation ni levée des sanctions n''a suivi.'
  explanation_en: 'The Trump-Kim summit in Hanoi, announced on 5 February 2019, took place on 27-28 February 2019 but ended without agreement: no denuclearisation plan or sanctions relief followed.'
  sources:
  - https://en.wikipedia.org/wiki/2019_North_Korea–United_States_Hanoi_Summit
  - https://www.voanews.com/amp/trump-kim-summit-ends-with-no-agreement-/4807344.html
- key: 2681-2
  verdict: unverifiable
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: Un examen conjoint par Barr et Whitaker de notes internes de Rosenstein relèverait de délibérations internes au ministère, non publiques.
  explanation_en: A joint review by Barr and Whitaker of Rosenstein's internal notes would be an internal, non-public departmental matter.
  sources: []
- key: 2681-3
  verdict: unverifiable
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: Le retrait d'une mission d'examen confiée à l'inspecteur général relèverait d'une décision interne au ministère ; aucune source publique ne permet de le vérifier.
  explanation_en: Withdrawing a review assignment from the inspector general would be an internal departmental decision; no public source allows it to be checked.
  sources: []
- key: 2681-4
  verdict: not_fulfilled
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: Trump a délégué à Barr le 23 mai 2019 le pouvoir de déclassifier les documents sur les origines de l'enquête russe, mais Barr n'a pas publié les demandes FISA annoncées dans l'année ; le rapport de l'inspecteur général du 9 décembre 2019 en a décrit le contenu.
  explanation_en: On 23 May 2019 Trump delegated to Barr the authority to declassify material on the origins of the Russia investigation, but Barr did not release the announced FISA material within the year; the inspector general's report of 9 December 2019 described its contents.
  sources:
  - https://www.axios.com/trump-orders-declassification-information-origins-russia-investigation-43979e33-8312-4dd2-9286-e1bbdcef1539.html
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
- key: 2681-5
  verdict: not_fulfilled
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: Q annonçait que Matthew Whitaker resterait parmi les hauts responsables du ministère. Après l'entrée en fonction de Barr, il a été brièvement conseiller au bureau du procureur général associé, puis a quitté le ministère le 2 mars 2019.
  explanation_en: Q claimed Matthew Whitaker would remain on senior DOJ staff. After Barr took office he briefly served as a counselor in the associate attorney general's office, then left the department on 2 March 2019.
  sources:
  - https://www.pbs.org/newshour/politics/ex-acting-ag-matthew-whitaker-leaves-justice-department
  - https://en.wikipedia.org/wiki/Matthew_Whitaker
- key: 2681-6
  verdict: unverifiable
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: Une réunion entre Barr, le procureur John Huber et l'inspecteur général relèverait du fonctionnement interne du ministère et n'a pas d'objet public vérifiable.
  explanation_en: A meeting between Barr, prosecutor John Huber and the inspector general would be an internal departmental matter with no checkable public object.
  sources: []
- key: 2681-8
  verdict: fulfilled
  horizon: '2020-02-09'
  trivial: false
  explanation_fr: La commission judiciaire de la Chambre avait autorisé le 7 février 2019, deux jours avant le message, une assignation contre Whitaker ; elle a assigné le ministère pour obtenir le rapport Mueller complet et voté le 8 mai 2019 pour tenir Barr pour coupable d'outrage au Congrès. La partie concernant Whitaker était donc déjà acquise.
  explanation_en: The House Judiciary Committee had authorised a subpoena for Whitaker on 7 February 2019, two days before the post; it later subpoenaed the full Mueller report and voted on 8 May 2019 to hold Barr in contempt of Congress. The Whitaker part had therefore already happened.
  sources:
  - https://cohen.house.gov/media-center/press-releases/congressman-cohen-votes-authorize-subpoena-whitaker
  - https://www.cnbc.com/2019/05/08/house-judiciary-committee-votes-to-hold-ag-barr-in-contempt-over-mueller-report.html
- key: 2694-0
  verdict: not_a_prediction
  horizon: '2020-02-11'
  trivial: false
  explanation_fr: Le message est une accusation adressée à Adam Schiff sur de prétendues fuites passées (« la prochaine fois que vous… »), non l'annonce d'un événement.
  explanation_en: The post is an accusation aimed at Adam Schiff about alleged past leaks ('the next time you…'), not the announcement of an event.
  sources: []
- key: 2711-0
  verdict: fulfilled
  horizon: '2020-02-14'
  trivial: true
  explanation_fr: Mitch McConnell avait annoncé le 14 février 2019, dans l'article cité par Q, que Trump signerait la loi de financement et déclarerait une urgence nationale ; Trump l'a fait le 15 février 2019.
  explanation_en: Mitch McConnell had announced on 14 February 2019, in the article Q linked, that Trump would sign the spending bill and declare a national emergency; Trump did so on 15 February 2019.
  sources:
  - https://en.wikipedia.org/wiki/National_Emergency_Concerning_the_Southern_Border_of_the_United_States
- key: 2725-0
  verdict: not_fulfilled
  horizon: '2020-02-14'
  trivial: false
  explanation_fr: Q annonçait une détérioration rapide de la santé « publique » de Bill et Hillary Clinton. Dans les douze mois suivants, aucun des deux n'a connu de problème de santé notable rendu public ; tous deux ont poursuivi leurs activités publiques (livres, tournées, campagne de 2020).
  explanation_en: Q claimed Bill and Hillary Clinton's 'public' health would rapidly deteriorate. In the following twelve months neither had any notable publicly reported health problem; both continued public activities (books, tours, the 2020 campaign).
  sources:
  - https://en.wikipedia.org/wiki/Hillary_Clinton
  - https://en.wikipedia.org/wiki/Bill_Clinton
- key: 2726-0
  verdict: unverifiable
  horizon: '2019-02-25'
  trivial: false
  explanation_fr: Des « tentatives de fausse bannière » possibles dans les dix jours ne désignent aucun événement identifiable ; qualifier un événement réel de « fausse bannière » relèverait de l'interprétation.
  explanation_en: Possible 'false flag attempts' in the next ten days name no identifiable event; labelling any real event a 'false flag' would be a matter of interpretation.
  sources: []
- key: 2726-1
  verdict: unverifiable
  horizon: '2019-02-25'
  trivial: false
  explanation_fr: Un « événement couvert plusieurs jours » est assez fréquent pour qu'aucune période de dix jours ne permette de valider ou d'infirmer l'annonce.
  explanation_en: A 'multiple day coverage event' is common enough that no ten-day window could confirm or refute the announcement.
  sources: []
- key: 2816-1
  verdict: unverifiable
  horizon: '2020-02-19'
  trivial: false
  explanation_fr: L'affirmation repose sur l'idée, propre à Q, que des enquêtes du SDNY, d'Adam Schiff et de Maxine Waters visaient à empêcher une déclassification ; ce but supposé n'est pas vérifiable et l'« échec » n'a pas de critère.
  explanation_en: The claim rests on Q's own premise that investigations by SDNY, Adam Schiff and Maxine Waters aimed to block a declassification; that supposed aim cannot be checked and 'failure' has no criterion.
  sources: []
- key: 2839-0
  verdict: fulfilled
  horizon: '2020-02-20'
  trivial: true
  explanation_fr: Mueller a remis son rapport au ministère de la Justice le 22 mars 2019, avant le rapport suivant de l'inspecteur général sur l'enquête russe (rapport FISA, 9 décembre 2019). La remise du rapport Mueller était alors annoncée comme imminente par la presse.
  explanation_en: Mueller delivered his report to the Justice Department on 22 March 2019, before the inspector general's next report on the Russia inquiry (the FISA report, 9 December 2019). The Mueller report was then widely reported to be imminent.
  sources:
  - https://en.wikipedia.org/wiki/Mueller_report
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
- key: 2843-0
  verdict: unverifiable
  horizon: '2019-02-21'
  trivial: false
  explanation_fr: « Le spectacle commence juste après » et la comparaison avec le Super Bowl ne désignent aucun événement vérifiable.
  explanation_en: '''The fun begins directly after'' and the Super Bowl comparison name no checkable event.'
  sources: []
- key: 2861-0
  verdict: not_a_prediction
  horizon: '2019-04-15'
  trivial: false
  explanation_fr: Q renvoie à ses propres messages antérieurs sur une prétendue offre de siège à la Cour suprême à Loretta Lynch ; les dates citées concernent le passé et le message n'annonce aucun événement à venir.
  explanation_en: Q refers back to its own earlier posts about an alleged Supreme Court seat offered to Loretta Lynch; the dates cited concern the past and the post announces no future event.
  sources: []
- key: 2903-0
  verdict: unverifiable
  horizon: '2019-03-19'
  trivial: false
  explanation_fr: « De GRANDS événements dans les 21 jours » ne désigne aucun événement précis. Le rapport Mueller a été remis le 22 mars 2019, après ce délai.
  explanation_en: '''BIG happenings within the next 21 days'' names no specific event. The Mueller report was delivered on 22 March 2019, after that window.'
  sources: []
- key: 2938-0
  verdict: not_fulfilled
  horizon: '2020-03-03'
  trivial: false
  explanation_fr: Q suggérait que la déclassification révélerait d'autres éléments, « pires que le dossier », fournis à la cour FISA. Le rapport de l'inspecteur général du 9 décembre 2019 a conclu que les informations de Christopher Steele avaient joué un rôle « central et essentiel » dans les demandes, et y a relevé 17 erreurs ou omissions ; il n'a pas fait apparaître d'autre source cachée.
  explanation_en: Q suggested declassification would reveal other 'anchors', worse than the dossier, given to the FISA court. The inspector general's report of 9 December 2019 found Christopher Steele's reporting played a 'central and essential' role in the applications and identified 17 errors or omissions; it did not reveal any other hidden source.
  sources:
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
- key: 3071-0
  verdict: not_fulfilled
  horizon: '2020-11-03'
  trivial: false
  explanation_fr: Q accusait les démocrates de préparer le « vol » de l'élection de 2020. Les autorités électorales fédérales et les tribunaux n'ont relevé aucune fraude susceptible d'avoir changé le résultat de l'élection du 3 novembre 2020 ; les recours en ce sens ont été rejetés.
  explanation_en: Q accused Democrats of preparing to 'steal' the 2020 election. Federal election authorities and courts found no fraud that could have changed the outcome of the 3 November 2020 election; lawsuits claiming otherwise were dismissed.
  sources:
  - https://en.wikipedia.org/wiki/2020_United_States_presidential_election
  - https://www.pbs.org/newshour/politics/barr-says-justice-department-found-no-evidence-of-fraud-that-would-change-election-outcome
- key: 3198-0
  verdict: not_fulfilled

- key: 166-0
  verdict: partial
  horizon: '2018-11-20'
  trivial: true
  explanation_fr: Twitter a bien appliqué de nouvelles règles à partir du 18 décembre 2017, mais elles portaient sur les contenus haineux, abusifs et violents, non sur le pistage ou les cookies évoqués par Q ; ces règles avaient été annoncées publiquement en novembre 2017.
  explanation_en: Twitter did start enforcing new rules on 18 December 2017, but they targeted hateful, abusive and violent content, not the tracking or cookies Q mentioned; the rules had been publicly announced in November 2017.
  sources:
  - https://www.arabnews.pk/node/1211021
- key: 166-1
  verdict: not_fulfilled
  horizon: '2018-11-20'
  trivial: false
  explanation_fr: Q évoquait un scénario où le Secret Service conseillerait à Trump de cesser d'utiliser Twitter. Trump a continué à tweeter abondamment jusqu'à la suspension de son compte par Twitter le 8 janvier 2021.
  explanation_en: Q described a scenario in which the Secret Service would advise Trump to stop using Twitter. Trump kept tweeting heavily until Twitter suspended his account on 8 January 2021.
  sources:
  - https://en.wikipedia.org/wiki/Deplatforming_of_Donald_Trump
- key: 166-2
  verdict: not_fulfilled
  horizon: '2018-11-20'
  trivial: false
  explanation_fr: Trump n'a pas été réduit au silence sur Twitter dans l'horizon ; son compte a été suspendu le 8 janvier 2021, après l'assaut du Capitole, pour d'autres motifs que ceux avancés par Q.
  explanation_en: Trump was not silenced on Twitter within the horizon; his account was suspended on 8 January 2021, after the Capitol attack, for reasons unrelated to Q's scenario.
  sources:
  - https://en.wikipedia.org/wiki/Deplatforming_of_Donald_Trump
- key: 166-3
  verdict: unverifiable
  horizon: '2018-11-20'
  trivial: false
  explanation_fr: « POTUS refuse d'être réduit au silence » est une formule sans objet précis, liée à un scénario hypothétique ; Trump a simplement continué à tweeter.
  explanation_en: '''POTUS refuses to be silenced'' is a phrase without a precise object, tied to a hypothetical scenario; Trump simply kept tweeting.'
  sources: []
- key: 228-0
  verdict: not_fulfilled
  horizon: '2018-11-25'
  trivial: false
  explanation_fr: Trump est resté président durant tout l'horizon. Le message peut aussi se lire comme un rappel de changements passés (élection de 2016).
  explanation_en: Trump remained president throughout the horizon. The post can also be read as a reference to past changes (the 2016 election).
  sources:
  - https://en.wikipedia.org/wiki/First_presidency_of_Donald_Trump
- key: 228-1
  verdict: not_fulfilled
  horizon: '2018-11-25'
  trivial: false
  explanation_fr: Le roi Salmane est resté au pouvoir et Mohammed ben Salmane était prince héritier depuis juin 2017, avant le message ; aucun nouveau changement de direction saoudienne n'a eu lieu dans l'horizon. Le message peut renvoyer à la purge de novembre 2017, déjà en cours.
  explanation_en: King Salman stayed in power and Mohammed bin Salman had been crown prince since June 2017, before the post; no new change of Saudi leadership occurred within the horizon. The post may refer to the November 2017 purge, already under way.
  sources:
  - https://en.wikipedia.org/wiki/Salman_of_Saudi_Arabia
  - https://en.wikipedia.org/wiki/Mohammed_bin_Salman
- key: 228-2
  verdict: not_fulfilled
  horizon: '2018-11-25'
  trivial: false
  explanation_fr: Angela Merkel a été réélue chancelière le 14 mars 2018 et l'est restée jusqu'en décembre 2021. Elle a annoncé le 29 octobre 2018 renoncer à la présidence de la CDU, ce qui ne constitue pas un changement à la tête du pays.
  explanation_en: Angela Merkel was re-elected chancellor on 14 March 2018 and remained in office until December 2021. On 29 October 2018 she announced she would give up the CDU chair, which is not a change of national leadership.
  sources:
  - https://en.wikipedia.org/wiki/Fourth_Merkel_cabinet
  - https://en.wikipedia.org/wiki/Angela_Merkel
- key: 228-3
  verdict: fulfilled
  horizon: '2018-11-25'
  trivial: true
  explanation_fr: Imran Khan est devenu Premier ministre du Pakistan le 18 août 2018 à l'issue des élections générales du 25 juillet 2018, prévues par le calendrier constitutionnel.
  explanation_en: Imran Khan became Prime Minister of Pakistan on 18 August 2018 after the general election of 25 July 2018, which was due under the constitutional calendar.
  sources:
  - https://en.wikipedia.org/wiki/2018_Pakistani_general_election

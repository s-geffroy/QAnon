- key: 34-5
  verdict: unverifiable
  horizon: '2018-11-01'
  trivial: false
  explanation_fr: Des opérations spéciales américaines à l'étranger ont lieu en permanence et sont en grande partie secrètes ; aucune opération intérieure du type décrit par Q n'a été rapportée. L'affirmation n'est pas vérifiable en l'état.
  explanation_en: US special operations abroad are continuous and largely secret; no domestic operation of the kind Q described was reported. The claim cannot be checked as stated.
  sources: []
- key: 34-6
  verdict: not_fulfilled
  horizon: '2018-11-01'
  trivial: false
  explanation_fr: Q annonçait l'usage du système d'alerte d'urgence pour un message direct aux citoyens lors d'arrestations. Cela n'a pas eu lieu ; le seul message national fut le test programmé par la FEMA de l'alerte présidentielle le 3 octobre 2018, sans rapport avec les affirmations de Q.
  explanation_en: Q claimed the Emergency Broadcast System would carry a direct message to citizens during the arrests. This did not happen; the only nationwide message was FEMA's scheduled test of the Presidential Alert on 3 October 2018, unrelated to Q's claims.
  sources:
  - https://en.wikipedia.org/wiki/Wireless_Emergency_Alerts
  - https://dailydot.com/qanon-failed-predictions
- key: 38-0
  verdict: unverifiable
  horizon: '2017-11-03'
  trivial: false
  explanation_fr: Des déploiements de la Garde nationale ont lieu en permanence (notamment après les ouragans de 2017) ; aucun déploiement inhabituel lié aux affirmations de Q n'a été rapporté le 3 novembre 2017.
  explanation_en: National Guard deployments happen constantly (notably after the 2017 hurricanes); no unusual deployment linked to Q's claims was reported on 3 November 2017.
  sources: []
- key: 43-2
  verdict: unverifiable
  horizon: '2017-11-03'
  trivial: false
  explanation_fr: « Guettez les confirmations demain » ne précise pas ce qui serait confirmé ; aucun fait vérifiable.
  explanation_en: '''Watch for confirmations tomorrow'' does not say what would be confirmed; nothing checkable.'
  sources: []
- key: 44-0
  verdict: fulfilled
  horizon: '2017-11-03'
  trivial: true
  explanation_fr: Q annonçait un message « important » de Trump sur Twitter avant son départ du vendredi. Le 3 novembre 2017, jour du départ annoncé pour la tournée asiatique, Trump a publié une série de tweets appelant le ministère de la Justice et le FBI à enquêter sur Clinton et le Parti démocrate ; le voyage était annoncé et Trump tweetait quotidiennement.
  explanation_en: Q claimed Trump would send an 'important' Twitter message before departing on Friday. On 3 November 2017, the announced start of his Asia tour, Trump posted tweets urging the Justice Department and FBI to investigate Clinton and the Democrats; the trip was pre-announced and Trump tweeted daily.
  sources:
  - https://www.cbsnews.com/amp/news/trump-tweets-about-donna-brazile-hillary-clinton
  - https://www.pbs.org/newshour/politics/trump-says-hes-disappointed-with-justice-department
- key: 47-0
  verdict: unverifiable
  horizon: '2017-11-02'
  trivial: false
  explanation_fr: « Faux drapeau » suppose une intention cachée invérifiable. Aucune attaque majeure n'a eu lieu aux États-Unis le 2 novembre 2017.
  explanation_en: '''False flag'' presumes an uncheckable hidden intent. No major attack occurred in the US on 2 November 2017.'
  sources: []
- key: 101-0
  verdict: unverifiable
  horizon: '2017-11-06'
  trivial: false
  explanation_fr: Le message est une suite de codes (« 11_6_TP_Pub ») sans signification établie ; l'interprétation du modèle ne repose sur rien de vérifiable.
  explanation_en: The post is a string of codes ('11_6_TP_Pub') with no established meaning; the model's reading rests on nothing checkable.
  sources: []
- key: 112-2
  verdict: not_a_prediction
  horizon: '2017-11-07'
  trivial: false
  explanation_fr: « Les élections de mardi n'ont plus d'importance » est une opinion, pas l'annonce d'un événement. Les élections du 7 novembre 2017 (Virginie, New Jersey) ont eu lieu normalement.
  explanation_en: '''Elections (tues) no longer matter'' is an opinion, not the announcement of an event. The 7 November 2017 elections (Virginia, New Jersey) took place normally.'
  sources: []
- key: 163-0
  verdict: unverifiable
  horizon: '2017-11-21'
  trivial: false
  explanation_fr: Q ne nomme pas le « témoin » censé comparaître ; aucun fait identifiable à vérifier.

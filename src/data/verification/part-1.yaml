- key: 500-0
  verdict: not_fulfilled
  horizon: '2020-04-10'
  trivial: false
  explanation_fr: Q associait « DEFCON 1 », « 4-10-20 » et « FIRE & FURY ». Aucune action militaire de ce type n'a eu lieu le 10 avril 2020 et le niveau DEFCON 1 n'a jamais été déclaré publiquement ; des commentateurs ont aussi lu « 4-10-20 » comme les initiales D-J-T.
  explanation_en: Q combined 'DEFCON 1', '4-10-20' and 'FIRE & FURY'. No military action of the kind took place on 10 April 2020 and DEFCON 1 has never been publicly declared; commentators also read '4-10-20' as the letters D-J-T.
  sources:
  - https://en.wikipedia.org/wiki/DEFCON
- key: 510-0
  verdict: unverifiable

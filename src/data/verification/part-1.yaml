  explanation_fr: 'Q annonçait l''inculpation de Huma Abedin le 6 novembre 2017. Elle n''a pas eu lieu : Abedin n''a jamais été inculpée.'
  explanation_en: 'Q claimed Huma Abedin would be indicted on 6 November 2017. This did not happen: Abedin was never charged.'

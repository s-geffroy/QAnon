  horizon: '2017-11-03'
  trivial: false
  explanation_fr: 'Q annonçait l''inculpation de John Podesta le 3 novembre 2017. Elle n''a pas eu lieu : Podesta n''a jamais été inculpé.'
  explanation_en: 'Q claimed John Podesta would be indicted on 3 November 2017. This did not happen: Podesta was never charged.'
  sources:
  - https://www.thedailybeast.com/pro-trump-conspiracy-qanon-keeps-missing-deadlines
  - https://en.wikipedia.org/wiki/John_Podesta

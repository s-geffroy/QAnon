  - https://www.thedailybeast.com/pro-trump-conspiracy-qanon-keeps-missing-deadlines
  - https://en.wikipedia.org/wiki/Huma_Abedin
- key: 16-0
  verdict: unverifiable
  horizon: '2017-11-04'
  trivial: false
  explanation_fr: « Tenir la promesse MAGA » vendredi et samedi ne désigne aucun événement précis. Le vendredi 3 novembre 2017, Trump partait pour une tournée en Asie, sans les limogeages ou arrestations attendus par les adeptes.
  explanation_en: '''Delivering on the MAGA promise'' on Friday and Saturday names no specific event. On Friday 3 November 2017 Trump left for an Asia tour, without the firings or arrests followers expected.'
  sources: []
- key: 16-1
  verdict: fulfilled
  horizon: '2018-10-31'
  trivial: false
  explanation_fr: Q affirmait que Trump ne courait « aucun risque de destitution ». Aucune procédure n'a eu lieu dans l'horizon de douze mois (prédiction réalisée sur cette période) ; Trump a ensuite été mis en accusation à deux reprises par la Chambre des représentants (18 décembre 2019 et 13 janvier 2021), puis acquitté par le Sénat les deux fois.
  explanation_en: Q claimed Trump faced 'zero risk of impeachment'. No impeachment occurred within the 12-month horizon (fulfilled over that period); Trump was later impeached twice by the House (18 December 2019 and 13 January 2021) and acquitted by the Senate both times.
  sources:
  - https://en.wikipedia.org/wiki/First_impeachment_of_Donald_Trump
  - https://en.wikipedia.org/wiki/Second_impeachment_of_Donald_Trump
- key: 19-1
  verdict: unverifiable
  horizon: '2018-11-01'
  trivial: false
  explanation_fr: '« Faux dirigeants noirs » démasqués : aucune personne, aucun fait ni aucun critère identifiable ne permet de vérifier cette affirmation, qui relève de la rhétorique partisane.'
  explanation_en: '''False black leaders'' being exposed: no identifiable person, fact or criterion allows this partisan claim to be checked.'
  sources: []
- key: 25-0
  verdict: unverifiable
  horizon: '2017-11-03'
  trivial: false
  explanation_fr: « Les preuves commencent le 3.11 » ne précise ni la nature ni l'objet des preuves. Aucune révélation correspondant aux affirmations de Q n'a été rendue publique à cette date.
  explanation_en: '''Proof to begin 11.3'' specifies neither the nature nor the object of the proof. No disclosure matching Q''s claims was made public on that date.'
  sources: []

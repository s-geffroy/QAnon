- key: 262-0
  verdict: partial
  horizon: '2017-12-27'
  trivial: false
  explanation_fr: Le 27 décembre 2017, BBC Radio 4 a diffusé un entretien de Barack Obama avec le prince Harry (enregistré en septembre, annoncé le 17 décembre, soit après le message de Q). Il s'agissait d'une interview radio, sans lien établi avec une « réponse » ni avec le code « RED » de Q ; la coïncidence de date est réelle, le contenu ne correspond pas.
  explanation_en: On 27 December 2017 BBC Radio 4 aired Barack Obama's interview with Prince Harry (recorded in September, announced on 17 December, i.e. after Q's post). It was a radio interview with no established link to a 'response' or to Q's 'RED' code; the date matches, the substance does not.
  sources:
  - https://www.npr.org/sections/thetwo-way/2017/12/27/573774407/in-bbc-interview-obama-tells-prince-harry-about-post-presidency-life
  - https://www.staradvertiser.com/2017/12/17/breaking-news/prince-harry-interviews-obama-for-radio-show/
- key: 262-1
  verdict: unverifiable
  horizon: '2017-12-28'
  trivial: false
  explanation_fr: Aucune source publique ne signale Barack Obama en Asie le 28 décembre 2017 ; sa tournée asiatique publique (Shanghai, New Delhi) avait eu lieu fin novembre - début décembre 2017, avant le message. Ses déplacements privés de fin d'année ne sont pas documentés de façon fiable.
  explanation_en: No public source places Barack Obama in Asia on 28 December 2017; his public Asia tour (Shanghai, New Delhi) took place in late November - early December 2017, before the post. His private year-end movements are not reliably documented.
  sources:
  - https://www.dailywire.com/news/shadow-president-barack-obama-meet-world-leaders-emily-zanotti

items:
- key: 1-0
  verdict: not_fulfilled
  horizon: '2017-10-30'
  trivial: false
  explanation_fr: 'Q annonçait le signalement du passeport de Hillary Clinton le 30 octobre 2017 dans le cadre d''une prétendue extradition. Rien de tel n''a été rapporté : Clinton n''a été ni arrêtée ni inculpée, et a continué à voyager librement.'
  explanation_en: 'Q claimed Hillary Clinton''s passport would be flagged on 30 October 2017 as part of an alleged extradition. Nothing of the kind was reported: Clinton was never arrested or charged and continued to travel freely.'
  sources:
  - https://dailydot.com/qanon-failed-predictions
  - https://en.wikipedia.org/wiki/QAnon
- key: 1-2
  verdict: not_fulfilled
  horizon: '2017-10-30'
  trivial: false
  explanation_fr: Q annonçait une opération militaire et une activation de la Garde nationale dans la plupart des grandes villes le 30 octobre 2017. Aucune mobilisation de ce type ni les émeutes annoncées n'ont eu lieu.
  explanation_en: Q claimed a military operation and a National Guard activation across most major cities on 30 October 2017. No such mobilisation, nor the riots Q announced, took place.
  sources:
  - https://dailydot.com/qanon-failed-predictions
  - https://www.thedailybeast.com/pro-trump-conspiracy-qanon-keeps-missing-deadlines
- key: 2-0
  verdict: not_fulfilled
  horizon: '2018-10-28'
  trivial: false
  explanation_fr: Q affirmait que Hillary Clinton était « détenue » et serait arrêtée. Elle n'a jamais été arrêtée ni inculpée ; cette annonce figure parmi les échecs les plus cités de Q.
  explanation_en: Q claimed Hillary Clinton was 'detained' and would be arrested. She was never arrested or charged; this is among Q's most cited failed predictions.
  sources:
  - https://dailydot.com/qanon-failed-predictions
  - https://en.wikipedia.org/wiki/QAnon
- key: 2-1
  verdict: unverifiable
  horizon: '2018-10-28'
  trivial: false
  explanation_fr: L'affirmation est liée à une prétendue arrestation de Hillary Clinton qui n'a jamais eu lieu ; elle n'a donc pas d'objet vérifiable. Trump a par ailleurs prononcé plusieurs allocutions télévisées sur d'autres sujets (p. ex. le discours sur l'état de l'Union du 30 janvier 2018).
  explanation_en: The claim is tied to an alleged arrest of Hillary Clinton that never happened, so it has no checkable object. Trump did give several televised addresses on other topics (e.g. the State of the Union on 30 January 2018).
  sources: []
- key: 2-2
  verdict: unverifiable
  horizon: '2018-10-28'
  trivial: false
  explanation_fr: « S'isoler pour éviter une mauvaise image » ne désigne aucun fait observable, et l'affirmation dépend d'arrestations qui n'ont pas eu lieu.
  explanation_en: '''Isolating himself to avoid negative optics'' describes no observable fact, and the claim depends on arrests that did not happen.'
  sources: []
- key: 2-3
  verdict: unverifiable
  horizon: '2017-10-30'
  trivial: false
  explanation_fr: « Mockingbird 10.30.17 » ne désigne aucun événement précis. Le 30 octobre 2017 fut le jour de la révélation de l'inculpation de Paul Manafort et Rick Gates par le procureur spécial, mais des inculpations étaient déjà annoncées par la presse le 27 octobre, et rien ne relie ce mot-code à cet événement.
  explanation_en: '''Mockingbird 10.30.17'' names no specific event. 30 October 2017 was the day the special counsel''s indictment of Paul Manafort and Rick Gates was unsealed, but charges had already been reported on 27 October, and nothing links the code word to that event.'
  sources: []
- key: 4-1
  verdict: unverifiable
  horizon: '2018-10-29'
  trivial: false
  explanation_fr: L'affirmation porte sur l'attitude de Trump « à mesure que des gens sont inculpés » dans le cadre de prétendues poursuites contre ses adversaires, qui n'ont pas eu lieu ; elle est donc sans objet vérifiable.
  explanation_en: The claim concerns Trump's stance 'as people begin to be indicted' in alleged prosecutions of his opponents that never took place, so it has no checkable object.
  sources: []
- key: 6-1
  verdict: unverifiable
  horizon: '2018-10-29'
  trivial: false
  explanation_fr: 'Variante du message précédent : la neutralité de Trump est conditionnée à des inculpations annoncées par Q qui n''ont pas eu lieu ; rien de vérifiable.'
  explanation_en: 'A variant of the previous post: Trump''s neutrality is conditioned on indictments announced by Q that did not happen; nothing checkable.'
  sources: []
- key: 8-0
  verdict: partial
  horizon: '2018-10-29'
  trivial: false
  explanation_fr: Q affirmait que les sénateurs républicains sur le départ (Jeff Flake et Bob Corker avaient annoncé en octobre 2017 ne pas se représenter) voteraient « pro-Trump ». Tous deux ont voté avec la position de Trump dans environ 86 à 90 % des cas et pour la réforme fiscale finale de décembre 2017, mais Corker a voté contre la version du Sénat du 2 décembre 2017 et tous deux ont critiqué publiquement le président ; l'affirmation selon laquelle leur départ n'était « pas un choix » reste sans fondement établi.
  explanation_en: Q claimed departing Senate Republicans (Jeff Flake and Bob Corker had announced in October 2017 they would not seek re-election) would vote 'pro Trump'. Both voted with Trump's position roughly 86-90% of the time and for the final tax bill in December 2017, but Corker voted against the Senate version on 2 December 2017 and both publicly criticised the president; Q's claim that their departures were 'not by choice' is unsupported.
  sources:
  - https://fivethirtyeight.com/features/the-last-hurrah-caucus-in-the-senate-now-has-the-power-to-kill-trumps-agenda
  - https://en.wikipedia.org/wiki/Bob_Corker
- key: 15-0

  explanation_fr: La Chambre reprenait ses travaux le 4 septembre 2018 après la pause d'août, et le Sénat siégeait (début des auditions de Brett Kavanaugh le même jour), selon un calendrier public.
  explanation_en: The House returned on September 4, 2018 after the August recess and the Senate was in session (Brett Kavanaugh's hearings began that day), as publicly scheduled.

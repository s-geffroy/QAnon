- key: 2070-0
  verdict: not_fulfilled
  horizon: '2019-09-03'
  trivial: false
  explanation_fr: Q annonçait le licenciement « imminent » de Bruce Ohr. Il est resté au ministère de la Justice bien au-delà de l'horizon et a pris sa retraite le 30 septembre 2020, alors qu'une procédure disciplinaire était en cours ; il n'a pas été poursuivi.
  explanation_en: Q announced Bruce Ohr's 'imminent' termination. He remained at the Justice Department well past the horizon and retired on September 30, 2020, while a disciplinary review was pending; he was not charged.
  sources: &id003

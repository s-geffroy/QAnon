  explanation_fr: Un test national de l'« alerte présidentielle » par la FEMA (et non le ministère de la Défense) était publiquement programmé pour le jeudi 20 septembre 2018 ; il a été reporté le 17 septembre à cause de l'ouragan Florence et a eu lieu le 3 octobre 2018.
  explanation_en: A national 'Presidential Alert' test by FEMA (not the Department of Defense) was publicly scheduled for Thursday, September 20, 2018; it was postponed on September 17 because of Hurricane Florence and took place on October 3, 2018.
  sources: &id002

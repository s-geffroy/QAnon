  explanation_fr: Q affirmait que la déclassification prouverait « sans discussion » que le gouvernement Obama avait sciemment présenté de fausses preuves à la cour FISA pour influencer l'élection. Le rapport de l'inspecteur général (décembre 2019) a relevé 17 erreurs ou omissions importantes, mais n'a pas établi d'intention politique ni de manœuvre visant l'élection.
  explanation_en: Q claimed declassification would prove 'without argument' that the Obama government knowingly presented false evidence to the FISA court to influence the election. The inspector general's report (December 2019) found 17 significant errors or omissions but did not establish political intent or an election-related scheme.
  sources:
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
- key: 2168-1
  verdict: not_fulfilled
  horizon: '2019-09-12'
  trivial: false
  explanation_fr: Q annonçait l'effondrement des autres sites relayant ses messages, 8chan devenant le seul canal. Reddit a fermé le forum r/greatawakening le 12 septembre 2018, mais les agrégateurs de « drops » ont continué ; c'est 8chan lui-même qui a été mis hors ligne le 5 août 2019.
  explanation_en: Q announced the collapse of the other sites relaying its posts, leaving 8chan as the only channel. Reddit closed r/greatawakening on September 12, 2018, but drop aggregators continued; it was 8chan itself that went offline on August 5, 2019.
  sources:
  - https://en.wikipedia.org/wiki/8chan
  - https://en.wikipedia.org/wiki/QAnon
- key: 2187-0

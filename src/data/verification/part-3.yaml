  explanation_en: '''BOOM [NEXT WEEK]'': no identifiable event is named for the week after August 11, 2018.'
  sources: []
- key: 1927-10
  verdict: not_a_prediction
  horizon: '2019-01-01'
  trivial: true
  explanation_fr: Q cite le décret présidentiel modifiant le Manuel des cours martiales, déjà signé et applicable au 1er janvier 2019 ; reproduire un texte officiel n'est pas une prédiction, et ce décret ne concernait pas les poursuites que Q laissait entendre.
  explanation_en: Q quotes the executive order amending the Manual for Courts-Martial, already signed and effective January 1, 2019; reproducing an official text is not a prediction, and the order did not concern the prosecutions Q implied.
  sources:
  - https://trumpwhitehouse.archives.gov/presidential-actions/2018-amendments-manual-courts-martial-united-states/
- key: 1947-0
  verdict: not_fulfilled
  horizon: '2019-08-28'
  trivial: false
  explanation_fr: Q annonçait que Google serait réglementé, après les accusations de Trump du 28 août 2018. Aucune réglementation spécifique n'a été adoptée dans l'année ; le ministère de la Justice a ouvert un examen antitrust en 2019 et n'a poursuivi Google que le 20 octobre 2020, hors horizon.
  explanation_en: Q announced Google would be regulated, after Trump's August 28, 2018 accusations. No specific regulation was adopted within the year; the Justice Department opened an antitrust review in 2019 and only sued Google on October 20, 2020, outside the horizon.
  sources:
  - https://en.wikipedia.org/wiki/United_States_v._Google_LLC_(2020)

- key: 2109-0
  verdict: fulfilled
  horizon: '2019-09-07'
  trivial: false
  explanation_fr: 'Q annonçait le départ imminent de Rod Rosenstein, au moment où la presse évoquait son possible limogeage (septembre 2018). Il est parti dans l''horizon de douze mois : démission annoncée le 29 avril 2019, effective le 11 mai 2019, après l''arrivée de William Barr — un départ volontaire plutôt que le renvoi alors évoqué.'
  explanation_en: 'Q announced Rod Rosenstein''s imminent departure, at a time when the press was reporting he might be fired (September 2018). He left within the 12-month horizon: his resignation was announced on April 29, 2019 and took effect on May 11, 2019, after William Barr took office — a voluntary departure rather than the dismissal then rumoured.'
  sources: &id001
  - https://en.wikipedia.org/wiki/Rod_Rosenstein
- key: 2113-0
  verdict: not_a_prediction
  horizon: '2018-09-30'
  trivial: true
  explanation_fr: 'Q renvoie à une information déjà publiée : le Washington Post avait révélé le 6 septembre 2018 qu''un grand jury entendait des témoins au sujet d''Andrew McCabe. McCabe n''a finalement jamais été inculpé (abandon annoncé en février 2020).'
  explanation_en: 'Q refers to already published news: the Washington Post had reported on September 6, 2018 that a grand jury was hearing witnesses regarding Andrew McCabe. McCabe was ultimately never charged (decision announced in February 2020).'
  sources:
  - https://en.wikipedia.org/wiki/Andrew_McCabe
- key: 2129-0
  verdict: not_fulfilled
  horizon: '2019-09-10'
  trivial: false
  explanation_fr: Q affirmait que la déclassification des documents FISA provoquerait le départ de Rod Rosenstein. Cette déclassification, ordonnée le 17 septembre 2018, a été suspendue le 21 ; Rosenstein n'a démissionné qu'en avril-mai 2019, sans lien avec une telle publication.
  explanation_en: Q claimed declassifying the FISA documents would trigger Rod Rosenstein's departure. That declassification, ordered on September 17, 2018, was suspended on the 21st; Rosenstein only resigned in April-May 2019, unrelated to any such release.
  sources:
  - https://www.scrippsnews.com/politics/political-scandals/inspector-general-to-review-trump-s-classified-doc-release
  - https://en.wikipedia.org/wiki/Rod_Rosenstein
- key: 2129-1
  verdict: not_fulfilled
  horizon: '2019-09-10'
  trivial: false
  explanation_fr: Q affirmait que tous les signataires des demandes FISA seraient publiquement connus comme visés par une enquête. La déclassification annoncée a été suspendue ; l'inspecteur général a examiné les demandes (rapport de décembre 2019) et l'enquête Durham n'a inculpé aucun des signataires.
  explanation_en: Q claimed all signers of the FISA applications would be publicly known to be under investigation. The announced declassification was suspended; the inspector general reviewed the applications (December 2019 report) and the Durham inquiry charged none of the signers.
  sources:
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
  - https://en.wikipedia.org/wiki/Durham_special_counsel_investigation
- key: 2129-2

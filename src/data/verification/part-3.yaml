- key: 1589-1
  verdict: unverifiable
  horizon: '2019-06-26'
  trivial: false
  explanation_fr: Q évoquait la publication prochaine de messages, courriels et relevés d'appels désignés par des initiales, sans préciser lesquels ; l'ensemble visé n'est pas défini. Les échanges Strzok-Page avaient déjà été en grande partie rendus publics.
  explanation_en: Q hinted at the upcoming release of texts, emails and call records identified only by initials, without saying which; the set referred to is undefined. The Strzok-Page messages had already largely been made public.
  sources: []
- key: 1595-0
  verdict: unverifiable
  horizon: '2018-07-31'
  trivial: false
  explanation_fr: Q annonçait que juillet 2018 serait « le mois où le monde a découvert la VÉRITÉ », sans dire laquelle ; aucun événement vérifiable n'est désigné. Aucune révélation de l'ampleur suggérée n'a eu lieu ce mois-là.
  explanation_en: Q claimed July 2018 would be 'the month the world discovered the TRUTH', without saying which truth; no checkable event is named. No revelation of the suggested scale occurred that month.
  sources: []
- key: 1603-0
  verdict: unverifiable
  horizon: '2019-06-27'
  trivial: false
  explanation_fr: Q affirmait que des tentatives de « piéger » la Russie et le président seraient bientôt exposées, sans préciser lesquelles ni par qui. Le rapport Mueller (avril 2019) a au contraire documenté l'ingérence russe de 2016, tout en ne retenant pas de preuve suffisante d'une entente avec la campagne Trump.
  explanation_en: Q claimed attempts to 'frame' Russia and the president would soon be exposed, without saying which or by whom. The Mueller report (April 2019) instead documented Russian interference in 2016, while finding insufficient evidence of a conspiracy with the Trump campaign.
  sources: []
- key: 1603-2
  verdict: unverifiable
  horizon: '2019-06-27'
  trivial: false
  explanation_fr: Q annonçait que les promoteurs d'une « immigration forcée » seraient démasqués, sans désigner personne ni préciser de mécanisme ; l'objet n'est pas vérifiable.
  explanation_en: Q claimed the pushers of 'forced immigration' would be exposed, without naming anyone or describing how; there is no checkable object.
  sources: []
- key: 1608-0
  verdict: not_a_prediction
  horizon: '2019-06-27'
  trivial: true
  explanation_fr: Q cite la déclaration de Trey Gowdy du 31 janvier 2018 annonçant qu'il ne se représenterait pas ; il s'agit d'un fait déjà public, non d'une prédiction. Gowdy a effectivement quitté le Congrès en janvier 2019.
  explanation_en: Q quotes Trey Gowdy's January 31, 2018 statement that he would not seek re-election; this is an already public fact, not a prediction. Gowdy did leave Congress in January 2019.
  sources:
  - https://en.wikipedia.org/wiki/Trey_Gowdy
- key: 1670-0
  verdict: unverifiable
  horizon: '2018-07-04'
  trivial: false
  explanation_fr: '« Qu''en sera-t-il demain ? Coordonné. » : aucun événement identifiable n''est annoncé pour le 4 juillet 2018.'
  explanation_en: '''What will tomorrow be? Coordinated.'': no identifiable event is announced for July 4, 2018.'
  sources: []
- key: 1745-0
  verdict: not_fulfilled
  horizon: '2019-07-28'
  trivial: false
  explanation_fr: Q affirmait que les documents FISA confirmeraient « immédiatement » des actes illégaux de leurs signataires. Une version caviardée des demandes de surveillance de Carter Page avait été publiée le 21 juillet 2018 ; ni elle ni le rapport de l'inspecteur général (décembre 2019, 17 erreurs ou omissions importantes) n'ont conduit à des poursuites contre les signataires, et l'enquête Durham n'en a inculpé aucun.
  explanation_en: Q claimed the FISA documents would 'immediately' confirm illegal acts by their signers. A redacted version of the Carter Page surveillance applications had been released on July 21, 2018; neither it nor the inspector general's report (December 2019, 17 significant errors or omissions) led to charges against the signers, and the Durham inquiry charged none of them.
  sources:
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
  - https://en.wikipedia.org/wiki/Durham_special_counsel_investigation
- key: 1745-1
  verdict: not_fulfilled
  horizon: '2019-07-28'
  trivial: false
  explanation_fr: Q affirmait que les documents FISA prouveraient qu'une « campagne d'espionnage » de l'administration Obama visant à truquer l'élection reposait sur de fausses informations. Le rapport de l'inspecteur général (décembre 2019) a relevé de graves erreurs dans les demandes visant Carter Page, mais a jugé l'ouverture de l'enquête Crossfire Hurricane fondée et n'a pas trouvé de preuve d'un biais politique à son origine.
  explanation_en: Q claimed the FISA documents would prove that an Obama administration 'spy campaign to rig an election' rested on false information. The inspector general's report (December 2019) found serious errors in the Carter Page applications, but found the opening of Crossfire Hurricane adequately predicated and no evidence that political bias drove it.
  sources:
  - https://en.wikipedia.org/wiki/Inspector_General_report_on_the_Crossfire_Hurricane_investigation
- key: 1745-3
  verdict: not_fulfilled
  horizon: '2019-07-28'
  trivial: false
  explanation_fr: Q annonçait une déclassification par le président de passages clés des documents FISA. Trump a ordonné le 17 septembre 2018 la déclassification de pages de la demande visant Carter Page, puis y a renoncé le 21 septembre en confiant les documents à l'inspecteur général ; rien n'a été déclassifié dans l'horizon d'un an.
  explanation_en: Q announced a presidential declassification of key parts of the FISA documents. Trump ordered pages of the Carter Page application declassified on September 17, 2018, then backed off on September 21, sending the documents to the inspector general; nothing was declassified within the one-year horizon.
  sources:
  - https://www.scrippsnews.com/politics/political-scandals/inspector-general-to-review-trump-s-classified-doc-release
- key: 1762-0
  verdict: partial
  horizon: '2019-07-30'
  trivial: true
  explanation_fr: Q insinuait que la Californie allumerait des incendies pour obtenir des fonds fédéraux. De grands incendies étaient déjà en cours (Carr Fire depuis le 23 juillet 2018), et le Camp Fire a suivi en novembre ; les enquêtes ont attribué le Carr Fire à l'étincelle d'un véhicule et le Camp Fire à des lignes électriques de PG&E, sans aucun lien avec l'État.
  explanation_en: Q insinuated that California would light fires to obtain federal money. Major fires were already burning (Carr Fire since July 23, 2018), and the Camp Fire followed in November; investigations attributed the Carr Fire to a vehicle spark and the Camp Fire to PG&E power lines, with no link to the state.
  sources:
  - https://en.wikipedia.org/wiki/Carr_Fire
  - https://en.wikipedia.org/wiki/Camp_Fire_(2018)
- key: 1762-1
  verdict: fulfilled
  horizon: '2019-07-30'
  trivial: true
  explanation_fr: 'La Californie a déclaré l''état d''urgence et obtenu des déclarations fédérales de catastrophe pour les incendies de 2018 (Carr Fire en août, Camp Fire en novembre) : c''est la procédure ordinaire en cas de sinistre, déjà engagée lors de la publication, non un stratagème comme le suggérait Q.'
  explanation_en: 'California declared states of emergency and obtained federal disaster declarations for the 2018 fires (Carr Fire in August, Camp Fire in November): the standard disaster procedure, already under way when Q posted, not a scheme as Q suggested.'
  sources:
  - https://en.wikipedia.org/wiki/2018_California_wildfires
  - https://en.wikipedia.org/wiki/Carr_Fire
- key: 1825-0
  verdict: not_a_prediction
  horizon: '2019-08-07'
  trivial: false
  explanation_fr: Q décrivait la stratégie des démocrates (« tout miser sur la vague bleue ») et non une victoire qu'il annonçait ; ailleurs, Q promettait une « vague rouge ». Les démocrates ont d'ailleurs remporté la Chambre en novembre 2018.
  explanation_en: Q was describing the Democrats' strategy ('all-in [Blue Wave]'), not predicting their victory; elsewhere Q promised a 'red wave'. Democrats did win the House in November 2018.
  sources:
  - https://en.wikipedia.org/wiki/2018_United_States_House_of_Representatives_elections
- key: 1833-0
  verdict: not_a_prediction
  horizon: '2019-08-10'
  trivial: false
  explanation_fr: Q affirmait que l'offensive démocrate en Californie visait à écarter Devin Nunes, sans prédire qu'il serait battu. Nunes a été réélu en novembre 2018 et a quitté le Congrès en janvier 2022 de son propre chef.
  explanation_en: Q claimed the Democratic push in California aimed at removing Devin Nunes, without predicting his defeat. Nunes was re-elected in November 2018 and left Congress of his own accord in January 2022.
  sources:
  - https://en.wikipedia.org/wiki/Devin_Nunes

# Lexique de la scene complotiste americaine : Reddit (Arctic Shift), 4chan /pol/
# (Zenodo, lu une seule fois), Google Trends.
#
# Il reprend PAR REFERENCE le glossaire (glossary.yaml) et les acteurs
# (actors.yaml) : voir qanon/lexicon.py. Pour les acteurs, seuls les motifs de
# noms sont repris hors du corpus Q : les codes courts propres a Q (JC, SA, AM,
# NK, RR...) seraient du bruit ailleurs.
#
# Une entree : id (slug unique), family, pattern (regex Python ; '(?i)' en tete
# = insensible a la casse), label_fr, label_en, pos / neg (exemples qui doivent /
# ne doivent pas correspondre : ce sont des tests), et en option :
#   ambiguous: true  -> compte, mais exclu des analyses principales ;
#   sensitive: true  -> publie seulement en agregats (codes de haine) ;
#   trends: true     -> interroge aussi dans Google Trends (requete = trends_query ou label_en) ;
#   note             -> choix de desambiguisation ;
#   anchors          -> mots-cles du crible, quand on ne sait pas les deriver du motif.
#
# lexicon_approved : empreinte du lexique approuve pour le balayage de /pol/
# (qanon.lexicon.fingerprint). Le balayage attend tant qu'elle ne correspond pas.
lexicon_approved: null

families:
  q_core: {fr: "Noyau Q", en: "Q core"}
  q_mythos: {fr: "Mythologie Q tardive", en: "Late Q mythology"}
  larp: {fr: "Pseudo-initiés d'avant Q", en: "Pre-Q insider LARPs"}
  promoter: {fr: "Promoteurs et relais", en: "Promoters and amplifiers"}
  platform: {fr: "Plateformes", en: "Platforms"}
  classic: {fr: "Complots classiques", en: "Classic conspiracies"}
  spiritual: {fr: "Registre religieux et apocalyptique", en: "Religious and apocalyptic register"}
  health: {fr: "Santé et COVID", en: "Health and COVID"}
  election: {fr: "Élections", en: "Elections"}
  militia: {fr: "Milices et violence", en: "Militias and violence"}
  hate: {fr: "Codes de haine", en: "Hate codes"}

# Formules du glossaire trop courantes hors du corpus Q : comptees, mais marquees
# ambigues (exclues des analyses principales) sur Reddit et /pol/.
glossary_ambiguous: [the-plan, drops, crumbs, anons, bakers-bread, deltas, patriots-digital-soldiers,
                     military-intelligence, comms, boom, gitmo, tick-tock, coincidences, deep-state,
                     the-storm, red-october, godspeed, clowns, save-the-children, castle-rock, mockingbird, kraken]

# Motifs d'acteurs (forme nue, sans \b ni contexte) trop ambigus hors du corpus Q.
actor_codes_excluded: [MIL, Rice, SIS, Kim, Paki, PAKI, Fox, Rome]

subreddits:
  - {name: conspiracy, note: "Forum complotiste generaliste, actif sur toute la periode"}
  - {name: greatawakening, banned: "2018-09-12"}
  - {name: CBTS_Stream, banned: "2018-03-14"}
  - {name: The_Donald, banned: "2020-06-29"}
  - {name: QAnonCasualties, note: "Proches de croyants (ouvert en 2019)"}
  - {name: conspiracytheories}

terms:

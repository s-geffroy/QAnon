    family: q_core
    pattern: '(?i)\bq[ -]?anons?\b|\bqanoners?\b|#qanon\b'
    label_fr: "QAnon"
    label_en: "QAnon"
    trends: true
    pos: ["QAnon is a hoax", "the q-anon crowd", "#QAnon", "qanoners again"]
    neg: ["Q and A", "quanon"]
  - id: q_attribution
    family: q_core
    pattern: '\bQ(?:''s|’s)? (?:said|says|posted|posts|dropped|drops|told|predicted|warned|team|clearance|proofs?|posters?|followers|believers|crowd|research)\b|\bQ (?:is|was) (?:right|real|a larp|a LARP|legit|fake)\b|\bwhat Q (?:said|meant)\b'
    label_fr: "« Q a dit… » (attributions à Q)"
    label_en: "'Q said...' (attributions to Q)"
    note: "Sensible a la casse : 'Q' majuscule suivi d'un verbe ou d'un nom typique ; evite 'Q1', 'Q&A'."
    pos: ["Q said this would happen", "Q's proofs are solid", "Q is a LARP", "Q team knows"]
    neg: ["Q1 earnings", "q said", "Q&A session"]
  - id: q_drop_term
    family: q_core
    pattern: '(?i)\bq[ -]?(?:drops?|posts?|proofs?|maps?|research)\b|\bqmap\.pub\b|\bqanon\.pub\b|\bqntmpkts\b'
    label_fr: "Q drop / Q post / qmap"

# Journal des versions du site (flux RSS et page Citer). Le plus recent en premier.
entries:
- date: 2026-10-16
  fr: "Polices hébergées avec le site (Atkinson Hyperlegible Next, Source Serif 4, licence SIL OFL) : plus aucune requête vers Google Fonts."
  en: "Typefaces now hosted with the site (Atkinson Hyperlegible Next, Source Serif 4, SIL OFL licence): no more requests to Google Fonts."
- date: 2026-10-16
  fr: "Nouvelle interface : quatre rubriques par question du lecteur (Ce que Q a écrit, Face aux faits, Modèles, Ressources), menu mobile, accueil qui confronte une annonce de Q aux faits puis regroupe les constats par question, sommaire latéral sur les pages longues, notes de méthode repliables, polices lisibles (Atkinson Hyperlegible Next, Source Serif 4), typographie française (espaces insécables avant la ponctuation haute et dans les guillemets) sur toutes les pages, les graphiques et le PDF."
  en: "New interface: four sections organised by the reader's question (What Q wrote, Against the facts, Models, Resources), mobile menu, a home page that sets one of Q's claims against the facts and groups findings by question, side contents on long pages, collapsible method notes, legible typefaces (Atkinson Hyperlegible Next, Source Serif 4), French typography (non-breaking spaces before high punctuation and inside quotation marks) on every page, chart and the PDF."
- date: 2026-10-15
  fr: "Lexique de la scène : 34 termes ajoutés (codes de Q, récits de 2016-2019, promoteurs, culture de /pol/, codes de haine) ; sur /pol/, mesurés dans les fils Q et l'échantillon à 1 %, sans nouveau balayage."
  en: "Scene lexicon: 34 terms added (Q codes, 2016-2019 narratives, promoters, /pol/ culture, hate codes); on /pol/, measured in Q threads and the 1% sample, without a new scan."
- date: 2026-10-15
  fr: "Toxicité de Q sur /pol/ ventilée par groupe : fils Q, posts isolés au vocabulaire de Q, posts citant un promoteur (Alex Jones surtout) ou un pseudo-initié ; l'écart entre moyenne d'ensemble et comparaison jour par jour tient à cette composition (page Modèles, tableau 5 du document de travail)."
  en: "Toxicity of Q on /pol/ broken down by group: Q threads, isolated posts using Q vocabulary, posts citing a promoter (mostly Alex Jones) or a pseudo-insider; the gap between the overall mean and the day-by-day comparison comes from this make-up (Models page, table 5 of the working paper)."
- date: 2026-10-15
  fr: "Q sur /pol/, son berceau : 134,5 millions de posts lus en entier ; naissance des formules de Q sur /pol/, part des fils Q, réponse de /pol/ aux sessions de Q, toxicité, codes de haine et vocabulaire propre aux fils Q (page Modèles, section 4.10 du document de travail)."
  en: "Q on /pol/, its cradle: 134.5 million posts read in full; birth of Q's formulas on /pol/, share of Q threads, /pol/'s response to Q sessions, toxicity, hate codes and the vocabulary specific to Q threads (Models page, section 4.10 of the working paper)."
- date: 2026-10-14
  fr: "Page Modèles : chaînes de Markov (régimes cachés, enchaînement des thèmes, dérive du style), analogies physiques (processus de Hawkes et loi d'Omori, mémoire longue, avalanches, phases) et Q dans la scène complotiste américaine (Reddit, Wikipédia, Google Trends, 4chan /pol/) ; document de travail 1.1 (sections 4.8 et 4.9)."
  en: "Models page: Markov chains (hidden regimes, topic sequences, style drift), physics analogies (Hawkes process and Omori law, long memory, avalanches, phases) and Q within the American conspiracy scene (Reddit, Wikipedia, Google Trends, 4chan /pol/); working paper 1.1 (sections 4.8 and 4.9)."
- date: 2026-10-13
  fr: "Version 1.0.0 archivée sur Zenodo (doi:10.5281/zenodo.23338131) ; publication automatique du site par le worker."
  en: "Version 1.0.0 archived on Zenodo (doi:10.5281/zenodo.23338131); the worker now publishes the site automatically."
- date: 2026-10-13
  fr: "Test de l'horoscope, prophéties recyclées et « Future proves past » ; explorateur du corpus ; veille bibliographique hebdomadaire ; kit pédagogique ; flux RSS, plan du site et métadonnées pour les moteurs."
  en: "Horoscope test, recycled prophecies and \"Future proves past\"; corpus explorer; weekly literature watch; teaching kit; RSS feed, sitemap and metadata for search engines."
- date: 2026-10-13
  fr: "Bibliographie portée à 267 références vérifiées ; licences : contenu CC BY 4.0, code MIT."
  en: "Bibliography expanded to 267 verified references; licences: content CC BY 4.0, code MIT."
- date: 2026-10-13
  fr: "FAQ et chiffres clés citables un par un ; état de la recherche ; page Statistiques (rythme, régimes, sources citées, lisibilité) ; intervalles de confiance."
  en: "FAQ and individually citable key figures; state of research; Statistics page (rhythm, regimes, cited sources, readability); confidence intervals."
- date: 2026-10-12
  fr: "Vérification une à une de 290 prédictions, avec sources ; relecture du glossaire, de la chronologie, du dictionnaire des acteurs et de la bibliographie."
  en: "One-by-one verification of 290 predictions, with sources; review of the glossary, timeline, actor dictionary and bibliography."
- date: 2026-10-12
  fr: "Première version : activité, discours, acteurs, Q et Trump, actualité mondiale (GDELT), intérêt public, prédictions annotées."
  en: "First version: activity, discourse, actors, Q and Trump, world news (GDELT), public interest, annotated predictions."

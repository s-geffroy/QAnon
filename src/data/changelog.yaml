# Journal des versions du site (flux RSS et page Citer). Le plus recent en premier.
entries:
- date: 2026-10-15
  fr: "Q sur /pol/, son berceau : 134,5 millions de posts lus en entier ; naissance des formules de Q sur /pol/, part des fils Q, réponse de /pol/ aux sessions de Q, toxicité, codes de haine et vocabulaire propre aux fils Q (page Modèles, section 4.10 du document de travail)."
  en: "Q on /pol/, its cradle: 134.5 million posts read in full; birth of Q's formulas on /pol/, share of Q threads, /pol/'s response to Q sessions, toxicity, hate codes and the vocabulary specific to Q threads (Models page, section 4.10 of the working paper)."
- date: 2026-10-14
  fr: "Page Modèles : chaînes de Markov (régimes cachés, enchaînement des thèmes, dérive du style), analogies physiques (processus de Hawkes et loi d'Omori, mémoire longue, avalanches, phases) et Q dans la scène complotiste américaine (Reddit, Wikipédia, Google Trends, 4chan /pol/) ; document de travail 1.1 (sections 4.8 et 4.9)."
  en: "Models page: Markov chains (hidden regimes, topic sequences, style drift), physics analogies (Hawkes process and Omori law, long memory, avalanches, phases) and Q within the American conspiracy scene (Reddit, Wikipedia, Google Trends, 4chan /pol/); working paper 1.1 (sections 4.8 and 4.9)."
